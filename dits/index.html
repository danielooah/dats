<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e5e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DiTs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DiTs</title>
<style>
:root{--bg:#e8e5e0;--karte:#f5f3ef;--rand:#d2cec7;--text:#1c1917;--leicht:#6f6a63;--akzent:#2c2927;--akzent2:#4b4743;--akzenttext:#fff;--marke:#e61923;--feld:#fff;--feldlesen:#f1eee9;--neutral:#dcd8d0;--hover:#ebe8e2;--feldrand:#aea89e;--gefahr:#c62828;
--okf:#d5ecd2;--oks:#a8d9ab;--wf:#fbebb5;--ws:#f4d975;--nf:#f6d1cb;--ns:#eea39b;--wahl:#2c2927;--wahltext:#fff;--sym:#2c2927;--symtext:#fff}
[data-thema=dunkel]{--bg:#121012;--karte:#1c191c;--rand:#2f2b30;--text:#f1eff1;--leicht:#a29ea6;--akzent:#f1eff1;--akzent2:#cfcbd2;--akzenttext:#171317;--marke:#ff4651;--feld:#141214;--feldlesen:#181618;--neutral:#2b282c;--hover:#2c292e;--feldrand:#5d5962;--gefahr:#ff7b72;
--okf:#1f3b2a;--oks:#2f6a45;--wf:#453c19;--ws:#7a6a1f;--nf:#4a2427;--ns:#8a3a3d;--wahl:#45414a;--wahltext:#f1eff1;--sym:#36323a;--symtext:#f1eff1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
#kopf{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;border-bottom:1px solid var(--rand)}
.marke{display:flex;align-items:center;gap:10px}.marke b{display:block;font-size:20px;line-height:1.1}.marke small{display:block;font-size:11px;color:var(--leicht)}
.punkt{width:14px;height:14px;border-radius:50%;background:var(--marke);flex:none}
.schalter{width:44px;height:24px;border-radius:12px;background:var(--feldrand);position:relative;align-self:center}
.schalter i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--karte);transition:left .2s}
.schalter.an{background:var(--akzent)}.schalter.an i{left:23px;background:var(--akzenttext)}
.stufe{grid-column:1/3;display:flex;flex-direction:column;gap:4px;cursor:pointer}.stufe>div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stufe b{font-size:14px}.stufe span{font-size:12px;color:var(--leicht)}
#app{max-width:680px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.leiste{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.leiste h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--leicht);margin:0;flex:1}
#rechts{font-weight:700;font-size:14px;color:var(--leicht);font-variant-numeric:tabular-nums}#rechts.rot{color:var(--gefahr)}
.zurueck{width:38px;height:38px;border-radius:10px;background:var(--karte);border:1px solid var(--rand);text-align:center;font-size:18px}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:16px;margin-bottom:12px}
.karte.mini{padding:12px 14px}.karte.mini p{margin:4px 0 0}
.abschnitt{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--leicht);margin-bottom:6px}.abschnitt.klein{margin-top:14px}.mt{margin-top:18px}
.leicht{color:var(--leicht)}.klein{font-size:13px}.mitte{text-align:center;display:block;margin:10px auto}
.zeile{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}.gross{font-size:22px}
.balken{height:7px;border-radius:4px;background:var(--neutral);overflow:hidden;margin:6px 0 10px}.balken i{display:block;height:100%;background:var(--akzent);border-radius:4px;transition:width .4s}
.balken.rot i{background:var(--marke)}.balken.gruen i{background:var(--oks)}.balken.gelb i{background:var(--ws)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;border-radius:9px;background:var(--neutral);font-size:14px}.chip em{font-style:normal;color:var(--leicht);font-size:12px;margin-left:4px}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kachel{background:var(--feldlesen);border:1px solid var(--rand);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:118px}
.kachel:active{background:var(--hover)}.kachel .sym{width:34px;height:34px;border-radius:8px;background:var(--sym);color:var(--symtext);display:grid;place-items:center;font-weight:700;font-size:17px;margin-bottom:6px}
.kachel b{font-size:16px}.kachel em{font-style:normal;font-size:12px;font-weight:700;color:var(--leicht)}
details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}details summary::-webkit-details-marker{display:none}
.themenliste{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.thema{display:flex;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:9px;background:var(--neutral);font-size:13px}.thema em{font-style:normal;font-size:11px;font-weight:700;color:var(--leicht)}
.thema.an{background:var(--wahl);color:var(--wahltext);font-weight:700}.thema.an em{color:var(--wahltext)}
.link{color:var(--text);text-decoration:underline;font-size:14px;margin-top:8px}
.knopf{display:inline-flex;justify-content:center;align-items:center;padding:12px 18px;border-radius:11px;background:var(--karte);border:1px solid var(--rand);font-weight:600;margin-top:10px}
.knopf.akzent{background:var(--akzent);color:var(--akzenttext);border-color:var(--akzent)}.knopf.breit{display:flex;width:100%}
.knopf.ja{background:var(--oks);border-color:var(--oks);color:var(--text)}.knopf.nein{background:var(--ns);border-color:var(--ns);color:var(--text)}.knopf.gefahr{color:var(--gefahr);border-color:var(--gefahr)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--leicht);background:var(--neutral);padding:3px 9px;border-radius:6px}
.frage{font-size:19px;line-height:1.35;margin:10px 0 14px}.frage-text{margin:6px 0 12px}
.optionen{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;background:var(--neutral);min-height:52px}
.opt .nr{flex:none;width:28px;height:28px;border-radius:7px;background:var(--sym);color:var(--symtext);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.richtig{background:var(--oks)}.opt.falsch{background:var(--ns)}.opt.grau{color:var(--leicht)}.opt.grau .nr{background:var(--rand);color:var(--leicht)}
.rueck{border-radius:12px;padding:14px;margin-top:12px}.rueck.ok{background:var(--okf)}.rueck.nein{background:var(--nf)}.rueck p{margin:6px 0 2px}.rueck ol{margin:8px 0 4px;padding-left:20px}.rueck li{margin:3px 0}
.runde{margin-top:14px}
.ergebnis{text-align:center;padding:10px 0}.riesig{font-size:44px;font-weight:800}.reihe{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wischkarte{background:var(--feld);border:1px solid var(--feldrand);border-radius:16px;padding:22px 18px;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:8px 0 12px;transition:transform .25s,background .25s;touch-action:pan-y;user-select:none}
.wischkarte.gross{min-height:300px}.wischkarte h3{font-size:20px;margin:10px 0}.wischkarte.ok{background:var(--okf)}.wischkarte.nein{background:var(--nf)}.wischkarte.hinten{background:var(--feldlesen)}
.wischkarte.neigt-l{box-shadow:-6px 0 0 var(--ns)}.wischkarte.neigt-r{box-shadow:6px 0 0 var(--oks)}
.wischkarte .antwort{font-size:17px}.fragez{font-size:28px;font-weight:800;color:var(--marke)}.hinweis{color:var(--gefahr);font-size:14px;margin:6px 0 0}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.paar .knopf{margin:0;padding:16px;font-size:17px}
.liste{display:grid;gap:8px}.eintrag{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--feldlesen);border:1px solid var(--rand);border-radius:12px;padding:12px 14px}
.eintrag b{display:block}.eintrag small{color:var(--leicht);font-size:12px}.eintrag em{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap}.eintrag.hl{border-color:var(--akzent)}
.brett{display:grid;grid-template-columns:1fr 1fr;gap:8px}.brett>div{display:grid;gap:8px;align-content:start}
.feld{background:var(--neutral);border-radius:10px;padding:12px 8px;min-height:54px;font-size:14px;text-align:center;transition:all .15s}
.feld.gewaehlt{background:var(--wahl);color:var(--wahltext)}.feld.weg{opacity:0;pointer-events:none}.feld.fehl{background:var(--ns)}
.gegeben{background:var(--feldlesen);border:1px solid var(--rand);border-radius:12px;padding:12px 14px}.gz{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:14px}.gz span{color:var(--leicht)}.gz b{text-align:right}
.eingabe{display:flex;gap:8px;align-items:center}.eingabe input{flex:1;min-width:0;padding:13px;border-radius:11px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;font-size:18px}
.eingabe input:focus{outline:none;border-color:var(--akzent)}.eingabe .knopf{margin:0}.eingabe span{color:var(--leicht);font-weight:700}
.kalk{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.kalk td{padding:2px 0}.kalk td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.kalk .summe td{font-weight:700}.kalk .notiz td{font-size:11px;color:var(--leicht);padding-bottom:4px}
.scroll{overflow-x:auto;margin-top:8px}.subnetze{border-collapse:collapse;font-size:12px;white-space:nowrap}.subnetze th{text-align:left;color:var(--leicht);font-size:10px;padding:2px 10px 2px 0}
.subnetze td{padding:2px 10px 2px 0;font-variant-numeric:tabular-nums}.subnetze tr.mark td{font-weight:700}
textarea{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--feldrand);background:var(--feld);color:var(--text);font:inherit;font-size:16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--akzent)}textarea:disabled{background:var(--feldlesen)}
.szenario p{margin:8px 0 0;font-size:14px}
.krit{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;background:var(--neutral);margin-bottom:6px;font-size:14px}.krit em{font-style:normal;margin-left:auto;font-weight:700;font-size:12px;white-space:nowrap}
.krit .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--feldrand);background:var(--feld)}.krit.an{background:var(--oks)}.krit.an .box{background:var(--akzent);border-color:var(--akzent)}
.statzeile{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}.statzeile .balken{margin:7px 0}.statzeile b{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--akzent);color:var(--akzenttext);padding:10px 18px;border-radius:12px;font-weight:600;transition:all .3s;z-index:9;max-width:90vw}
.toast.an{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="kopf"></header>
<main id="app"></main>
<script>
const INHALTE = {"themen": {"hw": "Hardware", "spe": "Speicher, Backup & USV", "osi": "OSI, Ports & Switching", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall, NAT & VPN", "virt": "Virtualisierung & Cloud", "sec": "IT-Sicherheit", "dsgvo": "Datenschutz & DSGVO", "prog": "Programmieren & SQL", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service & Qualität", "green": "Entsorgung & Green IT"}, "kurz": {"hw": "Hardware", "spe": "Speicher & Backup", "osi": "OSI & Ports", "ip": "IP & Subnetting", "wlan": "WLAN", "dienste": "Netzwerkdienste", "fw": "Firewall & VPN", "virt": "Virtualisierung", "sec": "IT-Sicherheit", "dsgvo": "DSGVO", "prog": "Programmieren", "pm": "Projektmanagement", "kauf": "Angebot & Kauf", "hk": "Handelskalkulation", "service": "IT-Service", "green": "Green IT"}, "quiz": [["hw", "Welcher Cache ist am kleinsten und am schnellsten?", "L1-Cache", "L2-Cache|L3-Cache|Arbeitsspeicher (RAM)", "L1 ist am kleinsten und schnellsten, L3 am größten und langsamsten – alle sind schneller als RAM."], ["hw", "Aus welcher Speicherart besteht der CPU-Cache?", "SRAM", "DRAM|SDRAM|Flash-Speicher", "SRAM muss nicht aufgefrischt werden, ist schnell und teuer → ideal für den Cache. DRAM ist günstig → Arbeitsspeicher."], ["hw", "Mit welcher Spannung arbeitet DDR4-RAM?", "1,2 V", "1,5 V|1,1 V|1,8 V", "DDR3 = 1,5 V, DDR4 = 1,2 V, DDR5 = 1,1 V. Jede Generation braucht weniger Spannung."], ["hw", "Wie heißt das Modul zum Chip DDR4-3200?", "PC4-25600", "PC4-3200|PC4-12800|PC5-25600", "Rechentrick: Chip-Zahl × 8 Byte. 3200 × 8 = 25.600 MB/s → PC4-25600."], ["hw", "Welcher Teil der CPU rechnet und vergleicht?", "Rechenwerk (ALU)", "Steuerwerk (Control Unit)|Register|L3-Cache", "Die ALU rechnet arithmetisch und logisch. Das Steuerwerk holt und dekodiert Befehle."], ["hw", "Wo steckt die frühere North-Bridge in modernen PCs?", "In der CPU", "Auf der Grafikkarte|Im BIOS-Chip|Im Netzteil", "Die North-Bridge (CPU, RAM, Grafik) ist in die CPU gewandert. Übrig bleibt ein Chip: PCH (Intel) bzw. FCH (AMD)."], ["hw", "Wie viele GT/s pro Lane schafft PCIe 4.0?", "16 GT/s", "8 GT/s|32 GT/s|5 GT/s", "PCIe 3.0 = 8, 4.0 = 16, 5.0 = 32 GT/s. Faustregel: Jede Generation verdoppelt."], ["hw", "Wie schnell ist USB 2.0 (Hi-Speed)?", "480 Mbit/s", "12 Mbit/s|5 Gbit/s|100 Mbit/s", "USB 1.1 = 12 Mbit/s, USB 2.0 = 480 Mbit/s, USB 3.0 (3.2 Gen 1x1) = 5 Gbit/s."], ["hw", "Welcher Mainboard-Formfaktor misst ca. 17 × 17 cm?", "Mini-ITX", "Micro-ATX|ATX|Extended ATX", "Mini-ITX: 17 × 17 cm, sparsam, oft passiv gekühlt. Micro-ATX: 24,5 × 24,5 cm."], ["hw", "Was bedeutet Hyper-Threading (Intel) bzw. SMT (AMD)?", "Ein physischer Kern bearbeitet zwei Threads", "Zwei CPUs teilen sich ein Mainboard|Der Takt wird unter Last verdoppelt|Der RAM überträgt zweimal pro Takt", "Hyper-Threading/SMT: ein physischer Kern, zwei Threads. „Zweimal pro Takt“ ist DDR."], ["hw", "Bis zu welcher Leistung geht USB Power Delivery ab Version 3.1?", "240 W", "100 W|60 W|15 W", "USB-PD liefert bis 100 W, ab USB-PD 3.1 bis 240 W."], ["hw", "Was macht der RAM, wenn der Strom weg ist?", "Er verliert alle Daten (flüchtig)", "Er speichert alles im Cache|Er schreibt automatisch auf die SSD|Nichts, RAM ist nicht flüchtig", "RAM ist flüchtig. Wird er knapp, lagert das OS in die Auslagerungsdatei aus (virtueller Speicher)."], ["spe", "Welche Sicherungsart braucht zur Wiederherstellung die Vollsicherung plus ALLE folgenden Sicherungen der Reihe nach?", "Inkrementell", "Differenziell|Vollsicherung|Spiegelung (RAID 1)", "Inkrementell sichert nur Änderungen seit der letzten Sicherung – deshalb braucht man jedes Inkrement."], ["spe", "Eine differenzielle Sicherung sichert …", "Änderungen seit der letzten Vollsicherung", "Änderungen seit der letzten Sicherung (egal welcher)|immer alle Daten|nur geänderte Systemdateien", "Differenziell wächst täglich; Wiederherstellung = Vollsicherung + letzte differenzielle."], ["spe", "Was besagt die 3-2-1-Regel?", "3 Kopien, 2 verschiedene Medien, 1 Kopie außer Haus", "3 Backups pro Woche, 2 Admins, 1 Tresor|3 Platten im RAID, 2 Server, 1 Cloud|3 Generationen, 2 Bänder, 1 Vollsicherung", "3 Kopien, 2 Medien, 1 offline/extern – schützt vor Ransomware und Brand."], ["spe", "Was beschreibt der RPO?", "Wie viel Datenverlust maximal akzeptabel ist", "Wie schnell das System wieder laufen muss|Wie viele Kopien es gibt|Wie lange der USV-Akku hält", "RPO = maximaler Datenverlust (bestimmt, wie oft gesichert wird). RTO = wie schnell es wieder laufen muss."], ["spe", "Welche USV hat eine Umschaltzeit von 0 ms?", "Online / Doppelwandler (VFI)", "Offline / Standby (VFD)|Line-Interactive (VI)|Jede USV hat 0 ms", "Bei VFI läuft der Strom immer über Akku und Wechselrichter – es gibt nichts umzuschalten."], ["spe", "Eine USV hat 1500 VA bei cos φ = 0,6. Wie viel Wirkleistung liefert sie?", "900 W", "1500 W|2500 W|600 W", "Wirkleistung = VA × Leistungsfaktor = 1500 × 0,6 = 900 W."], ["spe", "Auf welcher Ebene greift ein Server auf ein SAN zu?", "Blockebene – wie eine lokale Platte", "Dateiebene über SMB/NFS|Nur per USB|Über HTTP-Downloads", "SAN = eigenes Speichernetz (iSCSI, Fibre Channel), Blockebene. NAS = Dateiebene im LAN."], ["spe", "RAID 5 mit 4 Platten à 2 TB – wie viel ist nutzbar?", "6 TB", "8 TB|4 TB|2 TB", "RAID 5: (n − 1) × kleinste Platte = 3 × 2 TB = 6 TB."], ["spe", "Warum ersetzt RAID kein Backup?", "Es schützt nicht vor Löschen, Ransomware oder Brand", "Weil RAID langsamer ist|Weil RAID nur mit SSDs geht|Weil RAID nur Metadaten speichert", "RAID schützt nur vor Plattenausfall."], ["spe", "Wie viele Platten braucht RAID 6 mindestens?", "4", "3|2|5", "RAID 6: mind. 4 Platten, (n − 2) × kleinste nutzbar, 2 Platten dürfen ausfallen."], ["spe", "Wofür steht beim Generationenprinzip der „Sohn“?", "Tägliche Sicherung", "Wöchentliche Sicherung|Monatliche Sicherung|Jährliche Sicherung", "Sohn = täglich, Vater = wöchentlich, Großvater = monatlich."], ["spe", "Wie löscht man eine SSD zuverlässig?", "Secure Erase oder physisch zerstören", "Mit einem Degausser|Einmal formatieren|In den Papierkorb verschieben", "Degausser und einfaches Überschreiben wirken bei SSDs nicht zuverlässig."], ["osi", "Auf welcher OSI-Schicht arbeitet ein (normaler) Switch?", "Schicht 2 – Sicherung", "Schicht 1 – Bitübertragung|Schicht 3 – Vermittlung|Schicht 4 – Transport", "Der Switch arbeitet mit MAC-Adressen → Schicht 2."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Router?", "Schicht 3 – Vermittlung", "Schicht 2 – Sicherung|Schicht 4 – Transport|Schicht 7 – Anwendung", "Router arbeiten mit IP-Adressen und routen → Schicht 3."], ["osi", "Auf welcher OSI-Schicht arbeitet ein Hub?", "Schicht 1 – Bitübertragung", "Schicht 2 – Sicherung|Schicht 3 – Vermittlung|Schicht 5 – Sitzung", "Ein Hub schickt alles an alle → Schicht 1 (wie Repeater)."], ["osi", "Welche Schicht kümmert sich um Kodierung, Kompression und Verschlüsselung?", "Schicht 6 – Darstellung", "Schicht 5 – Sitzung|Schicht 4 – Transport|Schicht 2 – Sicherung", "Darstellung (Presentation): ASCII, UTF-8, JSON, TLS-Verschlüsselung."], ["osi", "Zu welcher Schicht gehören TCP und UDP?", "Schicht 4 – Transport", "Schicht 3 – Vermittlung|Schicht 5 – Sitzung|Schicht 7 – Anwendung", "Transport: Segmentierung, Reihenfolge, Zuordnung per Port."], ["osi", "Welcher Port gehört zu RDP?", "3389", "3306|5900|22", "3389 = RDP, 3306 = MySQL, 5900 = VNC, 22 = SSH."], ["osi", "Welcher Port gehört zu IMAPS?", "993", "995|143|999", "143 = IMAP, 993 = IMAPS. 995 = POP3S. (999 war ein Fehler in deinen Unterlagen!)"], ["osi", "Welcher Port wird für SMTP-Submission mit TLS genutzt?", "587", "25|110|143", "25 = SMTP Server zu Server, 465/587 = SMTPS/Submission mit TLS."], ["osi", "Welcher Port gehört zu Kerberos?", "88", "389|636|445", "88 = Kerberos (Domänenanmeldung), 389 = LDAP, 636 = LDAPS, 445 = SMB."], ["osi", "Welcher Port gehört zu DNS?", "53", "67|123|161", "53 = DNS, 67/68 = DHCP, 123 = NTP, 161 = SNMP."], ["osi", "Was ändert sich an jedem Router auf dem Weg durchs Netz?", "Die MAC-Adressen", "Die IP-Adressen|Die Ports|Die Nutzdaten", "IP-Adressen bleiben gleich, MAC-Adressen ändern sich an jedem Hop."], ["osi", "Wie groß ist ein Ethernet-Frame?", "Maximal 1518 Byte, mindestens 64 Byte", "Immer genau 1518 Byte|Immer genau 1500 Byte|Maximal 64 Byte", "Max. 1518 Byte, davon 1500 Byte Nutzdaten (MTU). Minimum 64 Byte."], ["osi", "Wie läuft der TCP-3-Wege-Handshake ab?", "SYN → SYN-ACK → ACK", "ACK → SYN → FIN|SYN → ACK → SYN-ACK|SYN → FIN → ACK", "Client SYN, Server SYN-ACK, Client ACK. Der dritte Schritt beweist den Rückweg."], ["osi", "Welcher dieser Dienste nutzt typischerweise UDP?", "NTP", "SSH|HTTPS|SMTP", "UDP: DNS, DHCP, NTP, SNMP, VoIP, Streaming. TCP: HTTP(S), Mail, FTP, SSH, RDP."], ["osi", "Wie lang darf ein Twisted-Pair-Kupferkabel maximal sein?", "100 m", "30 m|500 m|1000 m", "Max. 100 m wegen Dämpfung und Übersprechen."], ["osi", "Welche Kupferkategorie ist für 10GBASE-T bei 500 MHz spezifiziert?", "Cat 6A", "Cat 5e|Cat 6|Cat 8", "Cat 6A: 500 MHz, 10 Gbit/s. Cat 6 nur bis 55 m mit 10 Gbit/s."], ["osi", "Was stimmt zu Singlemode-Glasfaser?", "Dünner Kern, bis 10–100 km, höchste Bandbreite über Distanz", "Dicker Kern, nur ca. 300 m|Langsamer als Multimode|Wird durch Störungen stark beeinflusst", "Singlemode = dünn, weit, schnell. Multimode = dicker Kern, kürzere Strecken, günstiger."], ["osi", "Wie lang ist eine MAC-Adresse?", "48 Bit", "32 Bit|64 Bit|128 Bit", "48 Bit = 12 Hex-Zeichen. Erste 24 Bit Hersteller (OUI), letzte 24 Bit Gerätenummer."], ["osi", "Womit trennt man Broadcast-Domänen?", "Router oder VLAN", "Switch|Hub|Repeater", "Alles an einem Switch ist eine Broadcast-Domäne. Trennung nur per Router oder VLAN."], ["osi", "Welcher Standard beschreibt VLANs?", "IEEE 802.1Q", "IEEE 802.1X|IEEE 802.3af|IEEE 802.11ac", "802.1Q = VLAN-Tagging. 802.1X = Port-Anmeldung, 802.3af = PoE."], ["osi", "Was verhindert Spanning Tree (STP)?", "Schleifen und Bro 127."], ["ip", "Wie lautet die Broadcastadresse von 192.168.16.52/25?", "192.168.16.127", "192.168.16.255|192.168.16.128|192.168.16.126", "Alle Host-Bits auf 1 → .127. Nutzbar: .1 bis .126."], ["ip", "Wie lang ist eine IPv6-Adresse?", "128 Bit", "64 Bit|32 Bit|256 Bit", "8 Blöcke à 4 Hex-Ziffern = 128 Bit."], ["ip", "Welches Präfix hat eine IPv6-Link-Local-Adresse?", "fe80::/10", "fc00::/7|2000::/3|ff00::/8", "fe80::/10 = Link-Local (wie APIPA), fc00::/7 = ULA, 2000::/3 = Global Unicast, ff00::/8 = Multicast."], ["ip", "Wie kürzt man 2001:0db8:0000:0000:0000:8a2e:0370:7334 korrekt?", "2001:db8::8a2e:370:7334", "2001:db8:0:8a2e:370:7334|2001:db8::8a2e::370:7334|21:db8::8a2e:37:7334", "Führende Nullen weg, eine längste Null-Folge durch :: ersetzen – nur einmal pro Adresse."], ["ip", "Wie viele /64-Netze stecken in einem /48-Präfix?", "65.536", "256|16|4.096", "64 − 48 = 16 Bit → 2¹⁶ = 65.536 Netze."], ["ip", "Lokales Netz funktioniert, Internet nicht. Wahrscheinlichste Ursache?", "Gateway fehlt oder ist falsch", "DNS fehlt|IP doppelt vergeben|Subnetzmaske zu groß", "Ohne Gateway kommt man nicht aus dem eigenen Netz raus."], ["ip", "Zugriff per IP klappt, per Name nicht. Ursache?", "DNS fehlt oder ist falsch", "Gateway fehlt|DHCP-Server aus|Kabel defekt", "Namensauflösung = DNS."], ["ip", "Ein /24 soll in 8 Subnetze geteilt werden. Welche neue CIDR?", "/27", "/25|/26|/28", "2³ = 8 → 3 Bits borgen: 24 + 3 = /27, je 30 Hosts, Blockgröße 32."], ["ip", "Was bedeutet Dual Stack?", "Geräte haben IPv4 und IPv6 parallel", "Zwei Router hintereinander|Zwei Netzwerkkarten pro PC|IPv6 wird in IPv4 getunnelt", "Dual Stack = beides parallel (DNS: A- und AAAA-Record). Tunneling = ein Protokoll im anderen."], ["ip", "Was ist die IPv6-Loopback-Adresse?", "::1", "fe80::1|127.0.0.1|ff02::1", "::1 entspricht 127.0.0.1. ff02::1 = alle Knoten (Multicast)."], ["ip", "Wie prüft ein Host, ob ein Ziel im eigenen Netz liegt?", "UND-Verknüpfung von IP und Subnetzmaske", "Per DNS-Anfrage|Per Ping e Antworten automatisch durch", "Sie liest den Inhalt jedes Pakets|Sie verschlüsselt den Verkehr|Sie vergibt IP-Adressen", "Nur die Startrichtung braucht eine Regel; das 5-Tupel steht in der State-Tabelle."], ["fw", "Wofür ist eine DMZ da?", "Eigenes Segment für öffentlich erreichbare Server", "Für Gäste-WLAN|Für Backups|Für Drucker", "Von der DMZ nur minimale, kontrollierte Zugriffe ins LAN."], ["fw", "Was zeichnet eine Back-to-Back-Firewall aus?", "Zwei Firewalls (ideal von zwei Herstellern) mit DMZ dazwischen", "Eine Firewall mit drei Anschlüssen|Eine Firewall pro PC|Zwei Firewalls parallel zur Lastverteilung", "Zwei Barrieren, hohe Sicherheit, aber teurer."], ["fw", "Was macht PAT (NAT Overload)?", "Viele private IPs teilen sich eine öffentliche, unterschieden über Ports", "Eine private IP fest auf eine öffentliche|Viele private auf einen Pool öffentlicher IPs|Verschlüsselt die Ports", "Standard bei jedem DSL-Router."], ["fw", "Was ist Port Forwarding?", "Eine feste DNAT-Regel von außen nach innen", "Ein VPN-Tunnel|Eine Firewall-Regel nach außen|Ein VLAN-Trunk", "z. B. 212.31.20.125:3389 → 10.0.0.9:3389. Braucht zusätzlich eine erlaubende Regel."], ["fw", "Welche Aussage zu NAT stimmt?", "NAT ist kein Sicherheitsfeature", "NAT ersetzt eine Firewall|NAT verschlüsselt den Verkehr|NAT funktioniert nur mit IPv6", "Schutz bringt die Stateful-Policy, nicht NAT."], ["fw", "Welche Technik nutzt man typischerweise für Site-to-Site-VPN?", "IPsec zwischen zwei Routern", "RDP|SNMP|HTTPS im Browser", "Clients brauchen dafür keine Software."], ["fw", "Warum kommt ein SSL-VPN fast überall durch?", "Es nutzt Port 443", "Es nutzt Port 22|Es braucht keine Ports|Es nutzt ICMP", "443 ist fast nirgends gesperrt."], ["fw", "In welcher Reihenfolge werden Firewall-Regeln geprüft?", "Von oben nach unten, die erste passende gilt", "Von unten nach oben|Die spezifischste gilt|Alle gleichzeitig, Mehrheit entscheidet", "Daher gehört Deny All ans Ende."], ["fw", "Was ist East-West-Verkehr?", 2.168.10.64", 1.5], ["Broadcast 192.168.10.127", 1.5]]}, {"frage": "Die Kanzlei möchte täglich sichern, aber möglichst wenig Speicher verbrauchen. Erläutern Sie den Unterschied zwischen inkrementeller und differenzieller Sicherung und nennen Sie, was jeweils zur Wiederherstellung benötigt wird.", "punkte": 4, "loesung": "Inkrementell: sichert die Änderungen seit der letzten Sicherung (egal welcher). Wiederherstellung: Vollsicherung + alle Inkremente der Reihe nach.\nDifferenziell: sichert die Änderungen seit der letzten Vollsicherung, wächst täglich. Wiederherstellung: Vollsicherung + letzte differenzielle Sicherung.", "kriterien": [["Inkrementell: seit letzter Sicherung", 1], ["Wiederherstellung: Voll + alle Inkremente", 1], ["Differenziell: seit letzter Vollsicherung", 1], ["Wiederherstellung: Voll + letzte Differenzielle", 1]]}, {"frage": "Nennen Sie die 3-2-1-Regel und erklären Sie, warum eine Kopie außer Haus bzw. offline liegen sollte.", "punkte": 3, "loesung": "3 Kopien der Daten, auf 2 verschiedenen Medien, 1 Kopie außer Haus.\nDie externe bzw. Offline-Kopie schützt vor Brand, Diebstahl und Ransomware, die alle Daten im Netz verschlüsseln könnte.", "kriterien": [["3 Kopien, 2 Medien, 1 außer Haus", 2], ["Begründung: Brand/Diebstahl/Ransomware", 1]]}, {"frage": "Nennen Sie drei technisch-organisatorische Maßnahmen (TOM) zum Schutz der Mandantendaten und ordnen Sie jede der passenden Kontrolle zu.", "punkte": 3, "loesung": "Beispiele: abgeschlossener Serverraum → Zutrittskontrolle; Anmeldung mit MFA → Zugangskontrolle; NTFS-Rechte nach Need-to-know → Zugriffskontrolle; VPN/HTTPS → Weitergabekontrolle; Protokollierung → Eingabekontrolle; Backup/USV → Verfügbarkeitskontrolle; AV-Vertrag mit Dienstleister → Auftragskontrolle.", "kriterien": [["1. Maßnahme mit richtiger Kontrolle", 1], ["2. Maßnahme mit richtiger Kontrolle", 1], ["3. Maßnahme mit richtiger Kontrolle", 1]]}, {"frage": "Für den Server soll eine USV beschafft werden. Welchen USV-Typ empfehlen Sie (mit Begründung)? Wie viel Wirkleistung liefert eine USV mit 1500 VA bei cos φ = 0,6?", "punkte": 4, "loesung": "Online-USV / Doppelwandler (VFI): Der Strom läuft immer über Akku und Wechselrichter, Umschaltzeit 0 ms, gleicht Störungen aus – geeignet für Server.\nWirkleistung = 1500 VA × 0,6 = 900 W.", "kriterien": [["Online / Doppelwandler (VFI)", 1], ["Begründung: 0 ms, immer über Wechselrichter", 1], ["Rechenweg VA × cos φ", 1], ["Ergebnis 900 W", 1]]}]}, {"titel": "Malerbetrieb Kraus: Beschaffung", "minuten": 30, "szenario": "Der Malerbetrieb Kraus braucht fünf neue Büro-PCs inklusive Office. Sie sollen zwei Angebote vergleichen, die Finanzierung beraten und für Ihren eigenen Betrieb den Verkaufspreis eines Monitors kalkulieren.", "aufgaben": [{"frage": "Berechnen Sie die Nutzwertanalyse und nennen Sie das bessere Angebot.\nGewichtung: Preis 40 %, Leistung 35 %, Service 25 %.\nAngebot A: Preis 8, Leistung 6, Service 7 Punkte.\nAngebot B: Preis 6, Leistung 9, Service 8 Punkte.", "punkte": 5, "loesung": "A: 8 × 0,40 + 6 × 0,35 + 7 × 0,25 = 3,2 + 2,1 + 1,75 = 7,05\nB: 6 × 0,40 + 9 × 0,35 + 8 × 0,25 = 2,4 + 3,15 + 2,0 = 7,55\n→ Angebot B hat den höheren Nutzwert.", "kriterien": [["Rechenweg Punkte × Gewichtung", 1], ["A = 7,05", 1.5], ["B = 7,55", 1.5], ["Entscheidung für B", 1]]}, {"frage": "Herr Kraus überlegt, die PCs zu leasen statt zu kaufen. Nennen Sie je einen Vorteil und einen Nachteil des Leasings gegenüber dem Kauf.", "punkte": 4, "loesung": "Vorteile: kein hoher Betrag auf einmal (Liquidität), feste planbare Raten, Raten als Betriebsausgaben absetzbar, Austausch nach Vertragsende.\nNachteile: insgesamt meist teurer, Eigentum bleibt beim Leasinggeber, Bindung an die Vertragslaufzeit.", "kriterien": [["Sinnvoller Vorteil", 2], ["Sinnvoller Nachteil", 2]]}, {"frage": "Kalkulieren Sie für einen Monitor: Listeneinkaufspreis 800 €, Lieferantenrabatt 10 %, Lieferantenskonto 2 %, Bezugskosten 15 €, Handlungskosten 25 %, Gewinn 10 %. Ermitteln Sie Einstandspreis, Selbstkostenpreis und Barverkaufspreis.", "punkte": 6, "loesung": "800,00 − 10 % (80,00) = 720,00 Zieleinkaufspreis\n720,00 − 2 % (14,40) = 705,60 Bareinkaufspreis\n705,60 + 15,00 = 720,60 € Einstandspreis\n720,60 + 25 % (180,15) = 900,75 € Selbstkostenpreis\n900,75 + 10 % (90,08) = 990,83 € Barverkaufspreis", "kriterien": [["Ziel- und Bareinkaufspreis richtig", 1.5], ["Einstandspreis 720,60 €", 1.5], ["Selbstkostenpreis 900,75 €", 1.5], ["Barverkaufspreis 990,83 €", 1.5]]}, {"frage": "Ein PC ist nach drei Monaten defekt. Erklären Sie den Unterschied zwischen Gewährleistung und Garantie und was der Kunde zuerst verlangen kann.", "punkte": 3, "loesung": "Gewährleistung: gesetzlich, 2 Jahre (an Verbraucher), gegenüber dem Verkäufer.\nGarantie: freiwillige Zusage des Herstellers.\nZuerst: Nacherfüllung (Reparatur oder Ersatz); erst danach Rücktritt, Minderung oder Schadensersatz.", "kriterien": [["Gewährleistung gesetzlich / Garantie freiwillig", 2], ["Zuerst Nacherfüllung", 1]]}, {"frage": "Für die fünf PCs wird Office benötigt. Vergleichen Sie OEM-Lizenz und Abo-Modell (z. B. Microsoft 365) und geben Sie eine Empfehlung.", "punkte": 3, "loesung": "OEM: an ein Gerät gebunden, nicht übertragbar, günstig.\nAbo: monatlich/jährlich, immer aktuell, pro Benutzer, flexibel bei neuen Mitarbeitern.\nEmpfehlung z. B. Abo wegen Aktualität und Flexibilität (andere Empfehlung mit guter Begründung ist ebenfalls richtig).", "kriterien": [["OEM richtig beschrieben", 1], ["Abo richtig beschrieben", 1], ["Begründete Empfehlung", 1]]}]}, {"titel": "Arztpraxis Dr. Yilmaz: WLAN und Sicherheit", "minuten": 30, "szenario": "Die Arztpraxis Dr. Yilmaz möchte ein WLAN für Mitarbeiter und ein Gäste-WLAN für das Wartezimmer. Drei Access Points sollen im 2,4-GHz-Band arbeiten. In der Praxis werden Patientendaten verarbeitet.", "aufgaben": [{"frage": "Der bisherige Dienstleister hat die SSID versteckt und einen MAC-Filter eingerichtet. Bewerten Sie beide Maßnahmen und empfehlen Sie eine sichere Lösung für das Mitarbeiter-WLAN.", "punkte": 5, "loesung": "SSID verstecken: unsicher, jedes Analyse-Tool findet den Namen trotzdem.\nMAC-Filter: unsicher, MAC-Adressen stehen im Klartext und lassen sich fälschen.\nEmpfehlung: WPA3 (oder WPA2 mit AES) als Enterprise mit 802.1X und RADIUS – jeder meldet sich einzeln an, Konten lassen sich sperren.", "kriterien": [["SSID verstecken unsicher + Grund", 1], ["MAC-Filter unsicher + Grund", 1], ["WPA3 bzw. WPA2-AES", 1], ["Enterprise / 802.1X / RADIUS", 2]]}, {"frage": "Welche Kanäle wählen Sie für die drei Access Points im 2,4-GHz-Band? Begründen Sie.", "punkte": 2, "loesung": "Kanäle 1, 6 und 11 – nur diese überlappen sich nicht (je 20 MHz breit, das Band hat nur ca. 83 MHz).", "kriterien": [["Kanäle 1, 6, 11", 1], ["Begründung: überlappungsfrei", 1]]}, {"frage": "Das Gäste-WLAN (VLAN 30, 10.30.0.0/24) darf nur ins Internet surfen. Erstellen Sie eine Firewall-Regeltabelle (Quelle, Ziel, Port/Protokoll, Aktion) mit 4 Regeln.", "punkte": 6, "loesung": "1. Gäste 10.30.0.0/24 → Praxis-LAN → Any → verweigern\n2. Gäste → DNS-Server/Internet → 53 UDP/TCP → erlauben\n3. Gäste → Internet → 80, 443 TCP → erlauben\n4. Any → Any → Any → verweigern (Deny All)\nAntworten kommen per Stateful Inspection automatisch zurück.", "kriterien": [["Zugriff aufs Praxis-LAN verweigert", 1.5], ["DNS (53) erlaubt", 1], ["HTTP/HTTPS (80/443) erlaubt", 1.5], ["Deny All am Ende", 1.5], ["Sinnvolle Reihenfolge / Spalten", 0.5]]}, {"frage": "Ein Praxis-Laptop mit Patientendaten wurde gestohlen. Was ist nach DSGVO zu tun, und welche Maßnahme hätte den Schaden verhindert?", "punkte": 4, "loesung": "Meldung an die Aufsichtsbehörde binnen 72 Stunden; bei hohem Risiko auch die betroffenen Patienten informieren; Vorfall dokumentieren.\nVorbeugung: Festplattenverschlüsselung (z. B. BitLocker).", "kriterien": [["Meldung an Behörde", 1], ["Frist 72 Stunden", 1], ["Betroffene informieren / dokumentieren", 1], ["Verschlüsselung (BitLocker)", 1]]}, {"frage": "Welches Schutzziel bedroht Ransomware in erster Linie? Nennen Sie zwei Schutzmaßnahmen.", "punkte": 3, "loesung": "Verfügbarkeit. Maßnahmen: Offline-Backups (3-2-1), Patches, Endpoint Protection, Schulung der Mitarbeiter, Segmentierung.", "kriterien": [["Verfügbarkeit", 1], ["1. Maßnahme", 1], ["2. Maßnahme", 1]]}]}, {"titel": "Autohaus Lenz: Störungen beheben", "minuten": 25, "szenario": "Sie sind im Service-Einsatz beim Autohaus Lenz. Mehrere Mitarbeiter melden Netzwerkprobleme. Das Firmennetz ist 192.168.1.0/24, Gateway 192.168.1.1, der Domänencontroller 192.168.1.10 ist auch DNS-Server.", "aufgaben": [{"frage": "Ein neu eingerichteter PC hat 192.168.1.130/25 mit Gateway 192.168.1.1. Er erreicht einige Geräte, das Internet aber nicht. Nennen Sie die Ursache und die Lösung.", "punkte": 4, "loesung": "Mit /25 liegt der PC im Netz 192.168.1.128–255, das Gateway .1 aber im Netz 0–127. Das Gateway liegt nicht im eigenen Subnetz.\nLösung: Maske auf /24 (255.255.255.0) korrigieren, passend zum restlichen Netz.", "kriterien": [["Ursache: falsche Maske / Gateway außerhalb", 2], ["Rechnerische Begründung", 1], ["Lösung: Maske /24", 1]]}, {"frage": "Ein anderer PC zeigt bei ipconfig die Adresse 169.254.23.4. Was bedeutet das? Nennen Sie drei Prüfschritte.", "punkte": 4, "loesung": "APIPA: Der PC hat keinen DHCP-Server erreicht und sich selbst eine Adresse gegeben.\nPrüfen: Kabel/Link-LED, Switchport bzw. VLAN, DHCP-Server läuft und Scope hat freie Adressen; danach ipconfig /renew.", "kriterien": [["APIPA / kein DHCP", 1], ["1. Prüfschritt", 1], ["2. Prüfschritt", 1], ["3. Prüfschritt", 1]]}, {"frage": "Ein Mitarbeiter kann \\\\server01 nicht öffnen, ping 192.168.1.10 klappt aber. Was ist die wahrscheinliche Ursache und mit welchen Befehlen prüfen Sie das?", "punkte": 3, "loesung": "Die Namensauflösung (DNS) funktioniert nicht, z. B. falscher DNS-Server eingetragen.\nPrüfen mit ipconfig /all (DNS-Eintrag) und nslookup server01.", "kriterien": [["DNS als Ursache", 1], ["ipconfig /all", 1], ["nslookup", 1]]}, {"frage": "Der Drucker im Verkauf fällt seit Wochen immer wieder aus. Sie haben ihn heute per Neustart wieder zum Laufen gebracht. Ordnen Sie beides nach ITIL ein.", "punkte": 3, "loesung": "Der heutige Ausfall ist ein Incident (Dienst schnell wiederherstellen, Workaround Neustart). Die wiederkehrende Ursache ist ein Problem, das analysiert und dauerhaft beseitigt werden muss.", "kriterien": [["Incident richtig erklärt", 1.5], ["Problem richtig erklärt", 1.5]]}, {"frage": "Für die Firewall-Freigaben fragt der Kunde nach Ports. Welche Dienste laufen standardmäßig auf 3389, 443, 53 und 22?", "punkte": 4, "loesung": "3389 = RDP, 443 = HTTPS, 53 = DNS, 22 = SSH/SFTP.", "kriterien": [["3389 RDP", 1], ["443 HTTPS", 1], ["53 DNS", 1], ["22 SSH", 1]]}, {"frage": "Eine neue Kamera braucht 24 W und soll per PoE versorgt werden. Welcher Standard ist mindestens nötig, und welcher Strom fließt bei 48 V?", "punkte": 3, "loesung": "802.3af liefert am Gerät nur 12,95 W → zu wenig. 802.3at (PoE+) mit 25,5 W reicht.\nI = P ÷ U = 24 W ÷ 48 V = 0,5 A.", "kriterien": [["802.3at / PoE+", 1.5], ["I = 0,5 A mit Rechenweg", 1.5]]}]}, {"titel": "Architekturbüro Wendt: Server und Cloud", "minuten": 30, "szenario": "Das Architekturbüro Wendt will seine drei alten Server durch einen leistungsstarken Server mit Virtualisierung ersetzen. E-Mail und Office sollen künftig über Microsoft 365 laufen. Große Plandateien werden regelmäßig an Kunden übertragen.", "aufgaben": [{"frage": "Erläutern Sie den Unterschied zwischen Hypervisor Typ 1 und Typ 2, nennen Sie je ein Beispiel und empfehlen Sie einen Typ für den Server.", "punkte": 4, "loesung": "Typ 1 (Bare Metal) läuft direkt auf der Hardware, wenig Overhead – z. B. VMware ESXi, Hyper-V. Typ 2 (Hosted) läuft als Programm auf einem Betriebssystem – z. B. VirtualBox, VMware Workstation.\nEmpfehlung: Typ 1 für den Server.", "kriterien": [["Typ 1 richtig erklärt + Beispiel", 1.5], ["Typ 2 richtig erklärt + Beispiel", 1.5], ["Empfehlung Typ 1", 1]]}, {"frage": "Ein Kollege schlägt Container statt VMs vor. Nennen Sie zwei Unterschiede.", "punkte": 3, "loesung": "VM: eigenes Betriebssystem, stärker isoliert, mehr Ressourcen.\nContainer: teilen den Kernel des Hosts, leichter, starten in Sekunden, weniger isoliert.", "kriterien": [["Eigenes OS vs. gemeinsamer Kernel", 1.5], ["Isolation / Ressourcen / Startzeit", 1.5]]}, {"frage": "Ordnen Sie Microsoft 365 einem Cloud-Servicemodell zu. Wer ist für die Daten nach DSGVO verantwortlich?", "punkte": 3, "loesung": "SaaS (Software as a Service): Der Anbieter betreibt alles bis zur Anwendung.\nFür den Inhalt der Daten bleibt immer der Kunde (das Architekturbüro) verantwortlich.", "kriterien": [["SaaS", 1.5], ["Verantwortung beim Kunden", 1.5]]}, {"frage": "Im Server sollen 4 Festplatten à 4 TB als RAID 5 laufen. Wie viel Speicher ist nutzbar, wie viele Platten dürfen ausfallen und warum ersetzt das kein Backup?", "punkte": 4, "loesung": "(4 − 1) × 4 TB = 12 TB nutzbar; 1 Platte darf ausfallen.\nRAID schützt nur vor Plattenausfall, nicht vor Löschen, Ransomware oder Brand.", "kriterien": [["12 TB", 1.5], ["1 Platte", 1], ["Kein Schutz vor Löschen/Ransomware/Brand", 1.5]]}, {"frage": "Der Hosting-Vertrag garantiert 99,9 % Verfügbarkeit. Wie viele Stunden Ausfall sind pro Jahr erlaubt (365 Tage)?", "punkte": 3, "loesung": "8.760 h × 0,001 = 8,76 Stunden pro Jahr.", "kriterien": [["Ansatz 8.760 h × 0,1 %", 1.5], ["Ergebnis 8,76 h", 1.5]]}, {"frage": "Eine Plandatei von 25 GB soll über eine 100-Mbit/s-Leitung übertragen werden. Wie lange dauert das ohne Overhead?", "punkte": 3, "loesung": "25 GB × 8 = 200 Gbit = 200.000 Mbit; 200.000 ÷ 100 = 2.000 s ≈ 33,3 Minuten.", "kriterien": [["Umrechnung Byte → Bit (× 8)", 1], ["2.000 s", 1], ["≈ 33 Minuten", 1]]}]}], "stufen": [[0, "Praktikant"], [200, "Azubi"], [600, "Junior-Admin"], [1200, "Admin"], [2200, "Senior-Admin"], [3600, "Netzwerk-Guru"], [5500, "IHK-Endgegner"]], "tagesziel": 50};
'use strict';
// ===== DiTs Mobil – Inhalte kommen aus INHALTE (gleiche Quelle wie die Desktop-App)
const D = INHALTE;
const THEMEN = D.themen, KURZ = D.kurz, QUIZ = D.quiz, WF = D.wf, KARTEN = D.karten,
  ZUORDNEN = D.zuordnen, PRUEFUNGEN = D.pruefungen, STUFEN = D.stufen, TAGESZIEL = D.tagesziel;

// ===== Speicher
const MEM = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('ltm_' + k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in MEM ? MEM[k] : d; },
  set(k, v) { MEM[k] = v; try { localStorage.setItem('ltm_' + k, JSON.stringify(v)); } catch (e) {} }
};
const neuerStand = () => ({ xp: 0, serie_tage: 0, letzter_tag: '', quiz: {}, wf: {}, karten: {}, rekorde: {}, themen: [], antworten: 0, richtig: 0, heute: null });
let F = Object.assign(neuerStand(), store.get('stand', {}));
['quiz', 'wf', 'karten', 'rekorde'].forEach(k => { if (!F[k] || typeof F[k] !== 'object') F[k] = {}; });
if (!Array.isArray(F.themen)) F.themen = [];
const speichern = () => store.set('stand', F);
let THEMA = store.get('thema', null) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dunkel' : 'hell');

// ===== Helfer
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/\n/g, '<br>');
const mischen = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const wahl = a => a[Math.floor(Math.random() * a.length)];
const r2 = x => Math.floor(x * 100 + 0.5 + 1e-9) / 100;
const de = (x, n = 2) => Number(x).toLocaleString('de-DE', { minimumFractionDigits: n, maximumFractionDigits: n });
const deK = x => { let s = de(x, 3); s = s.replace(/0+$/, '').replace(/,$/, ''); return s; };
const hoch = n => String(n).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const heuteIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function zahlLesen(t) {
  t = String(t).trim().replace(/\s|€|%/g, '');
  for (const e of ['TiB', 'KiB', 'MB/s', 'MB', 'TB', 'min', 'W', 'A', 'h', 's']) if (t.endsWith(e)) { t = t.slice(0, -e.length); break; }
  if (/,/.test(t) || /^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  const x = parseFloat(t); return isNaN(x) ? null : x;
}
const zahlPruefer = (w, tol) => t => { const x = zahlLesen(t); return x !== null && Math.abs(x - w) <= tol; };
const vibr = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ===== Level, XP, Heute
function stufe() {
  let i = 0; while (i + 1 < STUFEN.length && F.xp >= STUFEN[i + 1][0]) i++;
  const cur = STUFEN[i][0], nxt = STUFEN[i + 1] ? STUFEN[i + 1][0] : cur;
  return { nr: i + 1, name: STUFEN[i][1], anteil: nxt > cur ? (F.xp - cur) / (nxt - cur) : 1, rest: Math.max(0, nxt - F.xp) };
}
function heute() {
  if (!F.heute || F.heute.tag !== heuteIso()) F.heute = { tag: heuteIso(), xp: 0, antworten: 0, richtig: 0 };
  return F.heute;
}
function xpDazu(n) {
  const vorher = stufe().nr, h = heute(), zielVorher = h.xp >= TAGESZIEL;
  F.xp += n; h.xp += n;
  const t = heuteIso();
  if (F.letzter_tag !== t) {
    const g = new Date(); g.setDate(g.getDate() - 1);
    const gi = g.getFullYear() + '-' + String(g.getMonth() + 1).padStart(2, '0') + '-' + String(g.getDate()).padStart(2, '0');
    F.serie_tage = F.letzter_tag === gi ? (F.serie_tage || 0) + 1 : 1; F.letzter_tag = t;
  }
  speichern(); kopf();
  const s = stufe();
  if (s.nr > vorher) meldung(`Level ${s.nr}: ${s.name}!`);
  else if (!zielVorher && h.xp >= TAGESZIEL) meldung(`Tagesziel geschafft: ${TAGESZIEL} XP!`);
}
function zaehlen(art, idx, ok) {
  if (art) { const st = F[art][idx] || (F[art][idx] = { r: 0, f: 0 }); st[ok ? 'r' : 'f']++; }
  F.antworten++; const h = heute(); h.antworten++;
  if (ok) { F.richtig++; h.richtig++; }
}
function themaQuote(k) {
  let r = 0, f = 0;
  QUIZ.forEach((q, i) => { if (q[0] === k && F.quiz[i]) { r += F.quiz[i].r || 0; f += F.quiz[i].f || 0; } });
  WF.forEach((s, i) => { if (s[0] === k && F.wf[i]) { r += F.wf[i].r || 0; f += F.wf[i].f || 0; } });
  return [r, f];
}
const aktiveThemen = () => F.themen.length ? F.themen : Object.keys(THEMEN);
const schwache = () => Object.keys(F.quiz).map(Number).filter(i => i < QUIZ.length && F.quiz[i].f > 0 && F.quiz[i].f >= (F.quiz[i].r || 0));

function meldung(t) {
  const m = document.createElement('div'); m.className = 'toast'; m.textContent = t; document.body.appendChild(m);
  requestAnimationFrame(() => m.classList.add('an')); setTimeout(() => { m.classList.remove('an'); setTimeout(() => m.remove(), 300); }, 2400);
}

// ===== Grundgerüst
let laufend = [];   // Timer der aktuellen Ansicht
let tasten = null;
document.addEventListener('keydown', e => { if (tasten && !/TEXTAREA|INPUT/.test(e.target.tagName)) tasten(e); else if (tasten && e.target.tagName === 'INPUT' && e.key === 'Enter') tasten(e); });
function aufraeumen() { laufend.forEach(clearTimeout); laufend.forEach(clearInterval); laufend = []; tasten = null; }
const spaeter = (fn, ms) => { const id = setTimeout(fn, ms); laufend.push(id); return id; };
function themeSetzen() {
  document.documentElement.dataset.thema = THEMA;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = THEMA === 'dunkel' ? '#121012' : '#e8e5e0';
}
function themeWechseln() { THEMA = THEMA === 'dunkel' ? 'hell' : 'dunkel'; store.set('thema', THEMA); themeSetzen(); kopf(); }
function kopf() {
  const s = stufe();
  $('#kopf').innerHTML = `
    <button class="marke" onclick="start()"><i class="punkt"></i><span><b>DiTs</b><small>Lerntrainer · Fachinformatiker Systemintegration</small></span></button>
    <button class="schalter ${THEMA === 'dunkel' ? 'an' : ''}" onclick="themeWechseln()" aria-label="Dunkelmodus"><i></i></button>
    <div class="stufe" onclick="fortschritt()"><div><b>${esc(s.name)}</b><span>Lvl ${s.nr} · ${F.xp} XP · ${F.serie_tage || 0} ${(F.serie_tage || 0) === 1 ? 'Tag' : 'Tage'} in Folge</span></div><div class="balken rot"><i style="width:${s.anteil * 100}%"></i></div></div>`;
}
function buehne(titel, zurueck, rechts = '') {
  aufraeumen(); window.scrollTo(0, 0);
  $('#app').innerHTML = `<div class="leiste">${zurueck ? `<button class="zurueck" onclick="${zurueck}">←</button>` : ''}<h2>${esc(titel)}</h2><span id="rechts">${rechts}</span></div><div id="inhalt"></div>`;
  return $('#inhalt');
}
function rechts(t, rot) { const r = $('#rechts'); if (r) { r.textContent = t; r.classList.toggle('rot', !!rot); } }

// Wischen (Karten, Blitzrunde)
function wischbar(el, links, rechtsFn) {
  let x0 = null, y0 = null, dx = 0;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; el.style.transition = 'none'; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (x0 === null) return; dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > Math.abs(dy)) { el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; el.classList.toggle('neigt-l', dx < -40); el.classList.toggle('neigt-r', dx > 40); }
  }, { passive: true });
  el.addEventListener('touchend', () => {
    el.style.transition = ''; el.style.transform = ''; el.classList.remove('neigt-l', 'neigt-r');
    if (dx < -80) links(); else if (dx > 80) rechtsFn();
    x0 = null; dx = 0;
  });
}

      <div class="balken ${h.xp >= TAGESZIEL ? 'gruen' : 'rot'}"><i style="width:${Math.min(1, h.xp / TAGESZIEL) * 100}%"></i></div>
      <div class="abschnitt klein">SCHWÄCHSTE THEMEN</div>
      <div class="chips">${schwach.map(([k, q]) => `<button class="chip" onclick="quizStart(false,['${k}'])">${esc(KURZ[k])} <em>${q}</em></button>`).join('')}</div>
      ${nFehler ? `<button class="knopf akzent breit" onclick="quizStart(true)">Fehler üben (${nFehler} offen)</button>` : ''}
    </div>
    <div class="kacheln">${kacheln.map(([s, t, i, c]) => `<button class="kachel" onclick="${c}"><span class="sym">${s}</span><b>${t}</b><em>${i}</em></button>`).join('')}</div>
    <details class="karte themen" ${F.themen.length ? 'open' : ''}><summary><span class="abschnitt">THEMEN</span><span class="leicht">${F.themen.length ? F.themen.length + ' gewählt' : 'alle aktiv'} ▾</span></summary>
      <div class="themenliste">${Object.keys(THEMEN).map(k => { const [r, f] = themaQuote(k); return `<button class="thema ${F.themen.includes(k) ? 'an' : ''}" onclick="thema('${k}')"><span>${esc(KURZ[k])}</span><em>${r + f ? Math.round(r / (r + f) * 100) + ' %' : ''}</em></button>`; }).join('')}</div>

function thema(k) {

  speichern(); start();
}

// ===== Quiz
let QZ = null;
function quizStart(nurFehler, themen) {
  const th = themen || aktiveThemen();
  let pool = (nurFehler ? schwache() : QUIZ.map((q, i) => i)).filter(i => th.includes(QUIZ[i][0]));
  if (!pool.length) { meldung('Keine Fragen für diese Auswahl'); return; }
  const wert = i => { const s = F.quiz[i] || {}; return (s.r || 0) - 1.5 * (s.f || 0) + (Math.random() * 2 - 1); };
  pool = mischen(pool).sort((a, b) => wert(a) - wert(b));
  QZ = { liste: mischen(pool.slice(0, 10)), i: 0, ok: 0, combo: 0, falsch: [], fehler: nurFehler, xp: 0, themen };
  quizFrage();
}
function quizFrage() {
  const idx = QZ.liste[QZ.i], q = QUIZ[idx];
  QZ.opt = mischen([q[2], ...q[3].split('|')]); QZ.fertig = false;
  const titel = QZ.fehler ? 'Fehler üben' : (QZ.themen && QZ.themen.length === 1 ? 'Quiz ' + KURZ[QZ.themen[0]] : 'Quiz');
  const inh = buehne(`${titel} · ${QZ.i + 1}/${QZ.liste.length}`, 'start()', QZ.combo >= 2 ? 'Serie ×' + QZ.combo : '');
  inh.innerHTML = `<div class="balken"><i style="width:${QZ.i / QZ.liste.length * 100}%"></i></div>
    <span class="tag">${esc(THEMEN[q[0]])}</span><h3 class="frage">${esc(q[1])}</h3>
    <div class="optionen">${QZ.opt.map((o, k) => `<button class="opt" onclick="quizAntwort(${k})"><span class="nr">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div><p class="leicht klein runde" id="runde"></p>`;
  rundeText();
  tasten = e => { if (!QZ.fertig && '1234'.includes(e.key)) quizAntwort(+e.key - 1); else if (QZ.fertig && e.key === 'Enter') quizWeiter(); };
}
function rundeText() {
  const b = QZ.i + (QZ.fertig ? 1 : 0), el = $('#runde'); if (!el) return;
  el.textContent = b ? `Diese Runde: ${QZ.ok} richtig · ${b - QZ.ok} falsch · Serie ${QZ.combo} · +${QZ.xp} XP` : '';
}
function quizAntwort(k) {
  if (QZ.fertig) return; QZ.fertig = true;
  const idx = QZ.liste[QZ.i], q = QUIZ[idx], ok = QZ.opt[k] === q[2];
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (QZ.opt[j] === q[2]) b.classList.add('richtig'); else if (j === k) b.classList.add('falsch'); else b.classList.add('grau'); });
  zaehlen('quiz', idx, ok);
  let plus = 0;
  if (ok) { QZ.ok++; QZ.combo++; plus = 10 + Math.min(QZ.combo - 1, 5) * 2; QZ.xp += plus; } else { QZ.combo = 0; QZ.falsch.push(idx); vibr(60); }
  rechts(QZ.combo >= 2 ? 'Serie ×' + QZ.combo : ''); rundeText();
  $('#fb').innerHTML = `<div class="rueck ${ok ? 'ok' : 'nein'}"><b>${ok ? wahl(['Richtig!', 'Sitzt!', 'Genau so.', 'Stark!']) + ' +' + plus + ' XP' : 'Leider falsch.'}</b><p>${esc(q[4])}</p>
    <button class="knopf akzent" onclick="quizWeiter()">${QZ.i + 1 < QZ.liste.length ? 'Weiter' : 'Auswertung'}</button></div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

function quizWeiter() {

  if (bonus) xpDazu(bonus);
  const inh = buehne('Auswertung', 'start()');
  inh.innerHTML = ergebnis(`${QZ.ok} / ${n}`, p === 100 ? 'Perfekte Runde! +25 XP Bonus.' : p >= 70 ? 'Gut gemacht – das reicht für die Prüfung.' : p >= 50 ? 'Solide. Schau dir die Fehler unten an.' : 'Da geht noch was – genau dafür ist Üben da.',
    `+${QZ.xp + bonus} XP in dieser Runde`, [['Neue Runde', `quizStart(${QZ.fehler},${QZ.themen ? JSON.stringify(QZ.themen).replace(/"/g, "'") : 'undefined'})`, true], ...(schwache().length ? [['Fehler üben', 'quizStart(true)', false]] : [])])
    + merkliste('DAS SOLLTEST DU DIR MERKEN', QZ.falsch.map(i => [QUIZ[i][1], '✓ ' + QUIZ[i][2], QUIZ[i][4]]));
}
const ergebnis = (gross, text, klein, knoepfe) => `<div class="ergebnis"><div class="riesig">${esc(gross)}</div><p>${esc(text)}</p><p class="leicht">${esc(klein)}</p>

  const inh = buehne('Blitzrunde', 'start()');

function blitzZeigen() {

  BZ.i++; BZ.sperre = true;

}
function blitzEnde() {

  const th = aktiveThemen();

  if (!st.length) { meldung('Keine Karten für diese Auswahl'); return; }
  st = mischen(st).sort((a, b) => (F.karten[a] || 0) - (F.karten[b] || 0)).slice(0, 20);
  KK = { stapel: st, gesamt: st.length, um: false }; karteZeigen();
}
function karteZeigen() {
  if (!KK.stapel.length) {
    const inh = buehne('Karteikarten', 'start()');
    inh.innerHTML = ergebnis('Geschafft!', `Alle ${KK.gesamt} Karten gewusst.`, 'Karten, die du oft weißt, kommen seltener dran.', [['Neuer Stapel', 'kartenStart()', true], ['Start', 'start()', false]]);
    return;
  }
  const idx = KK.stapel[0], k = KARTEN[idx]; KK.um = false;
  const inh = buehne(`Karteikarten · noch ${KK.stapel.length}`, 'start()', 'Fach ' + (F.karten[idx] || 0));
  inh.innerHTML = `<div class="balken"><i style="width:${(KK.gesamt - KK.stapel.length) / KK.gesamt * 100}%"></i></div>
    <div class="wischkarte gross" id="kkarte" onclick="karteDrehen()"></div>
    <p class="leicht klein mitte" id="khin">Tippen zum Umdrehen</p>
    <div class="paar" id="kknoepfe" style="visibility:hidden"><button class="knopf nein" onclick="karteBewerten(false)">↺ Nochmal</button><button class="knopf ja" onclick="karteBewerten(true)">✓ Gewusst</button></div>`;
  karteSeite();
  wischbar($('#kkarte'), () => KK.um && karteBewerten(false), () => KK.um && karteBewerten(true));
  tasten = e => { if (e.key === ' ') { e.preventDefault(); karteDrehen(); } if (KK.um && e.key === '1') karteBewerten(false); if (KK.um && e.key === '2') karteBewerten(true); };
}
function karteSeite() {
  const k = KARTEN[KK.stapel[0]], el = $('#kkarte');
  el.classList.toggle('hinten', KK.um);
  el.innerHTML = KK.um ? `<span class="tag">${esc(THEMEN[k[0]])}</span><p class="leicht"><b>${esc(k[1])}</b></p><p class="antwort">${esc(k[2])}</p>`
    : `<span class="tag">${esc(THEMEN[k[0]])}</span><h3>${esc(k[1])}</h3><div class="fragez">?</div>`;
}
function karteDrehen() {
  KK.um = !KK.um; karteSeite();
  if (KK.um) { $('#kknoepfe').style.visibility = 'visible'; $('#khin').textContent = 'Wischen: links = nochmal, rechts = gewusst'; }
}
function karteBewerten(ok) {
  const idx = KK.stapel.shift();
  if (ok) { F.karten[idx] = Math.min((F.karten[idx] || 0) + 1, 5); xpDazu(2); }
  else { F.karten[idx] = 0; KK.stapel.splice(Math.min(3, KK.stapel.length), 0, idx); speichern(); }
  karteZeigen();
}

function zuordnenEnde() {

// ===== Rechentrainer
const ip2n = a => ((a[0] << 24) >>> 0) + (a[1] << 16) + (a[2] << 8) + a[3];
const n2ip = n => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
const maskeVon = c => n2ip(c === 0 ? 0 : (0xFFFFFFFF << (32 - c)) >>> 0);
const basis24 = () => wahl([() => [192, 168, wahl([0, 1, 2, 5, 10, 20, 30, 40, 50, 100, 178])], () => [10, 0, rnd(0, 60)], () => [172, 16, rnd(0, 31)]])();
const praefixPruefer = c => t => { t = t.trim().replace(/\s/g, '').replace(/,/g, '.'); return t.replace(/^\//, '') === String(c) || t === maskeVon(c); };
const ipPruefer = w => t => t.trim().replace(/\s/g, '').replace(/,/g, '.') === w;

  if (art === 'platte') { const tb = wahl([1, 2, 4, 8, 12, 16, 20]), tib = tb * 1e12 / 1024 ** 4;
    return { gegeben: [['Festplatte laut Hersteller', tb + ' TB (SI)']], frage: 'Wie viel TiB zeigt Windows an? (2 Nachkommastellen)', einheit: 'TiB', beispiel: 'z. B. 3,64',
      pruefen: zahlPruefer(tib, 0.011), loesung: de(tib) + ' TiB', schritte: [`${tb} TB = ${tb} × 10¹² Byte`, `÷ 1024⁴ = ${de(tib, 3)} TiB`, 'Es „fehlt“ nichts – nur eine andere Einheit.'] }; }
  if (art === 'rate') { const m = wahl([16, 50, 100, 250, 500, 1000]);
    return { gegeben: [['Internetleitung', m + ' Mbit/s']], frage: 'Wie viele MB pro Sekunde kommen maximal an?', einheit: 'MB/s', beispiel: 'z. B. 12,5',
      pruefen: zahlPruefer(m / 8, 0.06), loesung: de(m / 8) + ' MB/s', schritte: ['Klein-b = Bit, Groß-B = Byte; 1 Byte = 8 Bit', `${m} ÷ 8 = ${de(m / 8)} MB/s`] }; }
  if (art === 'kamera') { const rate = wahl([4, 6, 8, 16]), std = wahl([24, 48, 72, 168]), n = rnd(2, 8), eine = rate * 1e6 * 3600 * std / 8 / 1024 ** 4, ges = eine * n;
    return { gegeben: [['Kameras', n + ' Stück'], ['Datenrate je Kamera', rate + ' Mbit/s'], ['Aufzeichnung', std + ' Stunden']], frage: 'Wie viel Speicher wird benötigt? (TiB, 2 Nachkommastellen)',
      einheit: 'TiB', beispiel: 'z. B. 1,25', pruefen: zahlPruefer(ges, Math.max(0.011, ges * 0.01)), loesung: de(ges) + ' TiB',
      schritte: [`Pro Kamera: ${rate} Mbit/s × 3.600 s × ${std} h = ${de(rate * 3600 * std, 0)} Mbit`, 'Mbit → Bit (× 1000²) → Byte (÷ 8) → TiB (÷ 1024⁴)', `= ${de(eine, 3)} TiB × ${n} = ${de(ges)} TiB`] }; }
  if (art === 'byte') { const b = wahl([100000, 250000, 1500000, 3200000, 75000000]), mb = b / 1e6;
    return { gegeben: [['Datei', de(b, 0) + ' Byte']], frage: 'Wie viele MB (SI) sind das?', einheit: 'MB', beispiel: 'z. B. 0,1', pruefen: zahlPruefer(mb, 0.0005 + mb * 0.001), loesung: deK(mb) + ' MB',
      schritte: ['SI rechnet mit 1000: Byte ÷ 1000 = kB, ÷ 1000 = MB', `${de(b, 0)} ÷ 1000 ÷ 1000 = ${deK(mb)} MB`] }; }
  const tbit = wahl([1, 2, 5, 10, 20]), kib = tbit * 1e12 / 8 / 1024;
  return { gegeben: [['Datenmenge', tbit + ' Tb (Terabit)']], frage: 'Wie viele KiB sind das?', einheit: 'KiB', beispiel: 'z. B. 2.441.406.250', pruefen: zahlPruefer(kib, kib * 0.0005), loesung: de(kib, 0) + ' KiB',
    schritte: [`${tbit} Tb = ${tbit} × 10¹² Bit`, `÷ 8 = ${de(tbit * 1e12 / 8, 0)} Byte`, `÷ 1024 = ${de(kib, 0)} KiB`] };
}
const RECHENARTEN = {
  subnetz: ['Subnetting IPv4', 'Netz aufteilen, Netzgröße, Fehlersuche', aufgabeSubnetz], zahlen: ['Zahlensysteme', 'Dezimal, binär, hexadezimal', aufgabeZahlen],
  kalk: ['Handelskalkulation', 'Vom Listenpreis zum Bruttopreis', aufgabeKalk], sla: ['SLA-Ausfallzeit', 'Verfügbarkeit → Ausfallzeit', aufgabeSla],
  raid: ['RAID-Kapazität', 'Nutzbarer Speicher', aufgabeRaid], poe: ['PoE & Strom', 'Stromstärke und Standard', aufgabePoe], strom: ['Stromkosten', 'Kosten pro Jahr', aufgabeStrom],
  daten: ['Übertragungszeit', 'Menge ÷ Rate', aufgabeDaten], usv: ['USV-Leistung', 'VA × cos φ', aufgabeUsv], netzteil: ['Netzteil & Wirkungsgrad', 'P_real = P ÷ η', aufgabeNetzteil],
  speicher: ['Speichergrößen', 'SI/IEC, Bit/Byte, Kamera-Speicher', aufgabeSpeicher],

let RC = null;
function rechnenMenue() {
  const inh = buehne('Rechentrainer', 'start()');
  inh.innerHTML = `<p class="leicht klein">Jede Aufgabe wird neu gewürfelt. Komma oder Punkt ist egal.</p>` +
    auswahlListe([['Gemischt', 'alle Aufgabentypen', 'Serie ' + (F.rekorde.rechnen || 0), "rechnenStart('mix')", true], ...Object.entries(RECHENARTEN).map(([k, [n, b]]) => [n, b, '', `rechnenStart('${k}')`])]);
}
function rechnenStart(art) { RC = { art, serie: 0 }; rechnenNeu(); }
function rechnenNeu() {
  const k = RC.art === 'mix' ? wahl(Object.keys(RECHENARTEN)) : RC.art, a = RECHENARTEN[k][2]();
  RC.a = a; RC.fertig = false;
  const inh = buehne(RECHENARTEN[k][0], 'rechnenMenue()', 'Serie ' + RC.serie);
  inh.innerHTML = `<div class="gegeben"><div class="abschnitt">GEGEBEN</div>${a.gegeben.map(([n, w]) => `<div class="gz"><span>${esc(n)}</span><b>${esc(w)}</b></div>`).join('')}</div>
    <h3 class="frage">${esc(a.frage)}</h3>
    ${a.auswahl ? `<div class="optionen">${a.auswahl.map((t, i) => `<button class="opt" onclick="rechnenPruefen(${i})"><span class="nr">${i + 1}</span><span>${esc(t)}</span></button>`).join('')}</div>`
      : `<form class="eingabe" onsubmit="event.preventDefault();rechnenPruefen()"><input id="rin" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${a.text ? 'text' : 'decimal'}" placeholder="${esc(a.beispiel || '')}"><span>${a.einheit || ''}</span><button class="knopf akzent">Prüfen</button></form>`}
    <div id="fb"></div>`;
  const inp = $('#rin'); if (inp) setTimeout(() => inp.focus(), 100);
  tasten = e => { if (e.key === 'Enter' && RC.fertig) { e.preventDefault(); rechnenNeu(); } else if (!RC.fertig && a.auswahl && '1234'.includes(e.key) && +e.key <= a.auswahl.length) rechnenPruefen(+e.key - 1); };
}
function rechnenPruefen(w) {

  else { const t = $('#rin').value; if (!t.trim()) return; ok = a.pruefen(t); $('#rin').disabled = true; $('#rin').blur(); }

  if (ok) { RC.serie++; if (RC.serie > (F.rekorde.rechnen || 0)) F.rekorde.rechnen = RC.serie; xpDazu(15); } else { RC.serie = 0; speichern(); vibr(60); }
  rechts('Serie ' + RC.serie);
  let weg = '';
  if (a.kalk) weg = `<table class="kalk">${a.kalk.map(r => `<tr class="${r[3] ? 'summe' : ''}"><td>${esc(r[0])}</td><td>${de(r[1])} €</td></tr>${r[2] ? `<tr class="notiz"><td colspan="2">${esc(r[2])}</td></tr>` : ''}`).join('')}</table><p class="leicht klein">${a.hinweis}</p>`;
  else weg = `<ol>${a.schritte.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
  if (a.tabelle) weg += `<div class="scroll"><table class="subnetze"><tr>${a.tabelle.kopf.map(h => `<th>${h}</th>`).join('')}</tr>${a.tabelle.zeilen.map(z => `<tr class="${a.tabelle.markiert && z[0] === a.tabelle.markiert ? 'mark' : ''}">${z.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  $('#fb').innerHTML = `<div class="rueck ${ok ? 'ok' : 'nein'}"><b>${ok ? 'Richtig! +15 XP' : 'Nicht ganz. Richtig: ' + esc(a.loesung)}</b>${weg}<button class="knopf akzent" onclick="rechnenNeu()">Nächste Aufgabe</button></div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===== Prüfungssimulation
let PR = null;
const IHK = p => p >= 92 ? 'sehr gut (1)' : p >= 81 ? 'gut (2)' : p >= 67 ? 'befriedigend (3)' : p >= 50 ? 'ausreichend (4)' : p >= 30 ? 'mangelhaft (5)' : 'ungenügend (6)';
function pruefungMenue() {
  const inh = buehne('Prüfungssimulation', 'start()');
  inh.innerHTML = `<p class="leicht klein">Wie in der AP1: Kundenszenario mit offenen Teilaufgaben. Antwort schreiben, Musterlösung ansehen, ehrlich abhaken.</p>` +
    auswahlListe(PRUEFUNGEN.map((p, i) => [p.titel, `${p.aufgaben.length} Aufgaben · ${deK(p.aufgaben.reduce((s, a) => s + a.punkte, 0))} Punkte · ca. ${p.minuten} Min.`,
      F.rekorde['p' + i] !== undefined ? F.rekorde['p' + i] + ' %' : 'neu', `pruefungStart(${i})`]));
}
function pruefungStart(nr) {
  const p = PRUEFUNGEN[nr]; PR = { nr, i: 0, start: Date.now(), punkte: p.aufgaben.map(() => 0), antworten: p.aufgaben.map(() => '') };
  pruefungAufgabe();
}
function pruefungUhr() {
  const p = PRUEFUNGEN[PR.nr], s = Math.floor((Date.now() - PR.start) / 1000);
  rechts(`${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')} / ${p.minuten}:00`, s > p.minuten * 60);
}
function pruefungAufgabe() {
  const p = PRUEFUNGEN[PR.nr], a = p.aufgaben[PR.i]; PR.krit = a.kriterien.map(() => false);
  const inh = buehne(`Aufgabe ${String.fromCharCode(97 + PR.i)}) von ${p.aufgaben.length}`, 'pruefungMenue()');
  pruefungUhr(); const uhr = setInterval(pruefungUhr, 1000); laufend.push(uhr);
  inh.innerHTML = `<details class="karte szenario" ${PR.i === 0 ? 'open' : ''}><summary><span class="abschnitt">AUSGANGSSITUATION</span><span class="leicht klein">▾</span></summary><p><b>${esc(p.titel)}</b></p><p>${esc(p.szenario)}</p></details>
    <div class="zeile"><b>Aufgabe ${String.fromCharCode(97 + PR.i)})</b><span class="tag">${deK(a.punkte)} Punkte</span></div>
    <p class="frage-text">${esc(a.frage)}</p>
    <textarea id="pin" rows="7" placeholder="Deine Antwort …">${esc(PR.antworten[PR.i])}</textarea>
    <button class="knopf akzent breit" id="pknopf" onclick="pruefungLoesung()">Musterlösung zeigen</button><div id="punten"></div>`;
}
function pruefungLoesung() {
  const a = PRUEFUNGEN[PR.nr].aufgaben[PR.i];
  PR.antworten[PR.i] = $('#pin').value; $('#pin').disabled = true; $('#pknopf').remove();
  const letzte = PR.i + 1 >= PRUEFUNGEN[PR.nr].aufgaben.length;
  $('#punten').innerHTML = `<div class="rueck ok"><div class="abschnitt">MUSTERLÖSUNG</div><p>${esc(a.loesung)}</p></div>
    <div class="abschnitt mt">BEWERTUNG – hake ab, was du hattest</div>
    ${a.kriterien.map(([t, p], j) => `<button class="krit" id="k${j}" onclick="pruefungKrit(${j})"><span class="box"></span><span>${esc(t)}</span><em>${deK(p)} P.</em></button>`).join('')}
    <div class="zeile"><b id="psumme"></b></div><button class="knopf akzent breit" onclick="pruefungWeiter()">${letzte ? 'Auswertung' : 'Nächste Aufgabe'}</button>`;
  pruefungSumme(); $('#punten').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function pruefungKrit(j) { PR.krit[j] = !PR.krit[j]; $('#k' + j).classList.toggle('an', PR.krit[j]); pruefungSumme(); }
function pruefungSumme() {
  const a = PRUEFUNGEN[PR.nr].aufgaben[PR.i], p = a.kriterien.reduce((s, k, j) => s + (PR.krit[j] ? k[1] : 0), 0);
  PR.punkte[PR.i] = p; $('#psumme').textContent = `${deK(p)} von ${deK(a.punkte)} Punkten`;
}
function pruefungWeiter() {

  inh.innerHTML = ergebnis(proz + ' %', 'Note: ' + IHK(proz) + (neu ? ' · neues Bestergebnis' : ''), `${deK(err)} von ${deK(ges)} Punkten · ${min} Min. (Vorgabe ${p.minuten}) · +${plus} XP`,
    [['Andere Prüfung', 'pruefungMenue()', true], ['Nochmal', `pruefungStart(${PR.nr})`, false]])

}
