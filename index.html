  --akzent:#2c2927; --akzent-text:#ffffff; --marke:#e61923; --feld:#ffffff; --feldrand:#aea89e;
  --neutral:#dcd8d0; --gefahr:#c62828; --ok:#2e7d4f; --warn:#b26a00;
}
html[data-theme="dark"]{
  --bg:#121012; --card:#1c191c; --text:#f1eff1; --leicht:#a29ea6; --rand:#2f2b30;
  --akzent:#f1eff1; --akzent-text:#171317; --marke:#ff4651; --feld:#141214; --feldrand:#5d5962;
  --neutral:#2b282c; --gefahr:#ff7b72; --ok:#5ec48a; --warn:#e0a040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--rand)}
.bar h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punkt{width:14px;height:14px;border-radius:50%;background:var(--marke);flex:none}
.logo{width:32px;height:32px;border-radius:8px;flex:none;display:block;box-shadow:0 0 0 1px var(--rand)}
.row>.btn{display:inline-flex;align-items:center;justify-content:center}
.wrap{padding:14px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--rand);border-radius:14px;padding:14px;margin:0 0 12px}
.btn{border:1px solid var(--rand);background:var(--card);border-radius:12px;padding:12px 16px;min-height:46px;
  font-weight:600;cursor:pointer}
.btn.primary{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.btn.danger{color:var(--gefahr)}
.btn.klein{min-height:38px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:disabled{opacity:.5}
.icon{border:0;background:none;font-size:22px;min-width:44px;min-height:44px;cursor:pointer;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.field>label{font-size:13px;color:var(--leicht);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--feld);border:1px solid var(--feldrand);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marke);outline-offset:1px}
.secret{display:flex;gap:6px}.secret input{flex:1}
.check{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;font-weight:500}
.check input{width:24px;height:24px;accent-color:var(--akzent);flex:none}
details{background:var(--card);border:1px solid var(--rand);border-radius:14px;margin:0 0 12px;overflow:hidden}
summary{padding:14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--leicht);
  cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";font-size:16px}
details[open]>summary::after{content:"▴"}
details>.inhalt{padding:0 14px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--rand);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.aktiv{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.hinweis{font-size:13px;color:var(--leicht)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--neutral)}
.badge.warn{background:var(--marke);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.karte-liste{display:block;width:100%;text-align:left;border:1px solid var(--rand);border-left:6px solid var(--feldrand);
  background:var(--card);border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer}
.karte-liste.defekt{border-left-color:var(--marke)} .karte-liste.fertig{border-left-color:var(--ok)} .karte-liste.offen{border-left-color:var(--warn)}
.karte-liste b{display:block;font-size:17px}
.banner{background:var(--card);border:1px solid var(--marke);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.leer{text-align:center;color:var(--leicht);padding:40px 10px}
.fuss{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--rand);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.fuss .btn{flex:1}
.foto{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.foto img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--rand)}
.eintrag{border:1px solid var(--rand);border-radius:12px;padding:10px;margin:0 0 10px;background:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:20;
  background:var(--akzent);color:var(--akzent-text);padding:10px 16px;border-radius:12px;display:none;max-width:90vw}
dialog{border:1px solid var(--rand);border-radius:14px;background:var(--card);color:var(--text);max-width:92vw;width:420px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- Konstanten ---------- */
const TYPEN=['Windows-Rechner','Laptop','Server','Mac','Tablet','Smartphone','Drucker','Router','Firewall','Telefonanlage','NUC','Netzwerkgerät','Sonstiges'];
const ARTEN=['Neuinstallation','Reparatur'];
const KONFIG=['Nicht begonnen','In Arbeit','Abgeschlossen'];
const FERN=['NinjaOne','TeamViewer','AnyDesk','Windows-Remotedesktop','Sonstiges'];
const KONTO_ARTEN=['E-Mail','Programm/App','Benutzer','Sonstiges'];
const KONTO_TYPEN=['Lokal','Administrator','Domäne','Microsoft 365','Microsoft-Konto','Exchange','IMAP','POP3','Apple-ID','Google-Konto','Sonstiges'];
const STANDARD_VORLAGEN={'Standard-Arbeitsplatz':['Microsoft 365 Apps','Google Chrome','Mozilla Firefox','Adobe Acrobat Reader','7-Zip','NinjaOne Agent','ESET Endpoint Security'],'Server':['NinjaOne Agent','ESET Server Security','7-Zip']};
const UEBERNEHMEN=['typ','art','eingerichtet_von','grundkonfig','grundkonfig_notiz','ninjaone','eset','software','fern_tool','wlan'];
const ALT_DATENTRAEGER=['nicht ausgebaut / nicht relevant','ausgebaut und beim Kunden belassen','sicher gelöscht','physisch vernichtet'];
const ALT_LOESCH=['Secure Erase (Hersteller-Tool)','DBAN / Überschreiben','Windows-Zurücksetzen (nur Datenträger neu aufgesetzt)','Löschen per Diskpart clean all','Mechanisch zerstört'];
const ALT_ENTSORGUNG=['Mitgenommen zur Entsorgung','Entsorger / Wertstoffhof','Beim Kunden belassen','Weiterverwendet / verkauft'];
const CHECKLISTEN={
 'Arbeitsplatz einrichten':['Hardware aufgebaut und angeschlossen','Windows installiert und aktiviert','Windows-Updates installiert','Treiber installiert','Gerätename vergeben','Domäne beigetreten','Benutzer angelegt und angemeldet','Netzlaufwerke eingebunden','Drucker eingerichtet','E-Mail eingerichtet','VPN eingerichtet','Standardsoftware installiert','NinjaOne-Agent installiert','ESET installiert','BitLocker aktiviert','Backup geprüft','Funktionstest durchgeführt','Übergabe an Benutzer erfolgt'],
 'Router tauschen':['Konfiguration des alten Routers gesichert','Neuer Router aufgestellt und angeschlossen','Firmware aktualisiert','Standard-Passwort geändert','Internetzugang eingerichtet','WLAN (SSID, Passwort) eingerichtet','Gäste-WLAN eingerichtet','DHCP / IP-Bereich eingerichtet','Portfreigaben eingerichtet','Internet getestet','Konfiguration des neuen Routers gesichert','Altgerät zurückgesetzt'],
 'Firewall installieren':['Alte Konfiguration gesichert','Firewall aufgestellt und angeschlossen','Firmware aktuell','Standard-Passwort geändert','Schnittstellen / VLANs konfiguriert','Regeln eingerichtet','VPN eingerichtet','Lizenz / Updates aktiviert','Funktionstest durchgeführt','Konfiguration gesichert','Logging / Monitoring geprüft'],
 'Altgerät austauschen':['Daten gesichert / übertragen','Programme und Konten dokumentiert','Domäne verlassen / Konto bereinigt','Datenträger sicher gelöscht','Altgerät vom Netz genommen','Altgerät zur Entsorgung übergeben','Lizenzen freigegeben']};
const ALT_FELDER=['alt_bezeichnung','alt_sn','alt_datentraeger','alt_loeschmethode','alt_loeschdatum','alt_entsorgung','alt_uebergeben_an','alt_notiz'];
const FELDER=['bezeichnung','client_name','fuer_wen','typ','art','eingerichtet_von','modell','entsperrcode','datum','von','bis','grundkonfig','grundkonfig_notiz','hostname','ip','wlan','fern_tool','fern_id','notizen','router_admin','router_admin_pw','wlan_name','wlan_pw','ip_bereich','dhcp','portfreigaben',...ALT_FELDER,'dom_ou','dom_benutzer','netzlaufwerke','dns','vlan','firmware','checkliste_name','domaene'];
const HAKEN=['ninjaone','eset','dom_beigetreten','config_gesichert'];

/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
let zaehler=0;
const neueId=()=>(self.crypto&&crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):(Math.random().toString(36).slice(2)+Date.now().toString(36)));
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const jetztZeit=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const de=iso=>iso&&/^\d{4}-\d\d-\d\d$/.test(iso)?iso.slice(8)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):(iso||'');
function ls(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r===null?null:JSON.parse(r)}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat(5)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}
function ersetze(el,...kids){el.replaceChildren(...kids.flat(5).filter(k=>k!=null&&k!==false))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

const LOGO=(document.querySelector('link[rel="icon"]')||{}).href||'';
const IKONEN={
  auge:'<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/>',
  papierkorb:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>'};
function ikon(name){const e=document.createElement('span');e.style.cssText='display:inline-flex;align-items:center';
  e.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IKONEN[name]+'</svg>';return e}
function logo(){return h('img',{class:'logo',src:LOGO,alt:'DaTs'})}

/* ---------- Zeit und Dauer (wie im Büro-Programm) ---------- */
function parseDauer(t){t=String(t||'').trim().toLowerCase().replace(',','.');if(!t)return null;let m;
  if(m=t.match(/^(\d+):(\d{1,2})$/))return +m[1]*60+ +m[2];
  if(m=t.match(/^(\d+(?:\.\d+)?)\s*(?:min\w*)?$/))return Math.round(+m[1]);
  if(m=t.match(/^(\d+(?:\.\d+)?)\s*(?:h|std\w*|stunden?)$/))return Math.round(+m[1]*60);
  if(m=t.match(/^(\d+)\s*(?:h|std\w*|stunden?)\s*(\d+)\s*(?:m|min\w*)?$/))return +m[1]*60+ +m[2];
  return null}
function vonBis(v,b){const p=s=>{const m=/^(\d\d):(\d\d)$/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
  const a=p(v),c=p(b);return a==null||c==null||c<a?null:c-a}
function gDauer(g){const m=parseDauer(g.dauer);return m!=null?m:vonBis(g.von,g.bis)}
function dauerText(m){if(m==null)return '';if(m<60)return m+' Min';return Math.floor(m/60)+' Std '+(m%60)+' Min'}

/* ---------- Speicher (IndexedDB) ---------- */
let dbp=null;
function dbOeffnen(){return dbp||(dbp=new Promise((res,rej)=>{
  const r=indexedDB.open('dats-mobil',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('einr'))d.createObjectStore('einr',{keyPath:'uid'});
    if(!d.objectStoreNames.contains('inventar'))d.createObjectStore('inventar',{keyPath:'uid'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(mode,fn,speicher='einr'){const d=await dbOeffnen();return new Promise((res,rej)=>{
  const t=d.transaction(speicher,mode);const r=fn(t.objectStore(speicher));
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const alle=()=>tx('readonly',s=>s.getAll());
const sichern=o=>tx('readwrite',s=>s.put(o));
const loeschen=uid=>tx('readwrite',s=>s.delete(uid));
const invAlle=()=>tx('readonly',s=>s.getAll(),'inventar');
const invSichern=o=>tx('readwrite',s=>s.put(o),'inventar');
const invLoeschen=uid=>tx('readwrite',s=>s.delete(uid),'inventar');

/* ---------- Modell ---------- */
function neuesGeraet(datum){return {uid:neueId(),bezeichnung:'',client_name:'',fuer_wen:'',typ:TYPEN[0],art:ARTEN[0],
  eingerichtet_von:ls('eingerichtet_von')||'',modell:'',entsperrcode:'',datum:datum,von:'',bis:'',dauer:'',
  grundkonfig:KONFIG[0],grundkonfig_notiz:'',ninjaone:false,eset:false,hostname:'',ip:'',wlan:'',fern_tool:'',fern_id:'',
  notizen:'',router_admin:'',router_admin_pw:'',wlan_name:'',wlan_pw:'',ip_bereich:'',dhcp:'',portfreigaben:'',
  alt_bezeichnung:'',alt_sn:'',alt_datentraeger:'',alt_loeschmethode:'',alt_loeschdatum:'',alt_entsorgung:'',alt_uebergeben_an:'',alt_notiz:'',
  dom_beigetreten:false,dom_ou:'',dom_benutzer:'',domaene:'',netzlaufwerke:'',dns:'',vlan:'',firmware:'',config_gesichert:false,checkliste_name:'',checkliste:[],
  software:[],konten:[],fotos:[]}}
function neueEinrichtung(firma){const d=heute();return {uid:neueId(),kunde:'',firma:firma||'',datum:d,gast_wlan:false,gast_ssid:'',gast_pw:'',unterschrift:'',unterschrift_name:'',unterschrift_datum:'',geraete:[neuesGeraet(d)],geaendert:Date.now(),exportiert:0}}
function vorlagen(){const v=ls('vorlagen');return v&&typeof v==='object'?v:JSON.parse(JSON.stringify(STANDARD_VORLAGEN))}

let cur=null,curG=0,speicherTimer=null,curT=null,ansicht='liste';
function speichern(){if(curT&&ansicht==='invedit'){invSpeichernSpaeter();return}if(!cur)return;cur.geaendert=Date.now();clearTimeout(speicherTimer);
  speicherTimer=setTimeout(()=>sichern(cur).catch(()=>toast('Speichern nicht möglich')),300)}
function sofortSpeichern(){if(!cur)return Promise.resolve();clearTimeout(speicherTimer);return sichern(cur)}

/* ---------- Eingabefelder ---------- */
function feld(label,obj,key,o={}){const id='f'+(++zaehler);
  const inp=o.area?h('textarea',{id,rows:o.rows||3}):h('input',{id,type:o.type||'text',autocomplete:'off'});
  inp.value=obj[key]==null?'':obj[key];
  if(o.list)inp.setAttribute('list',o.list);
  if(o.mode)inp.setAttribute('inputmode',o.mode);
  inp.addEventListener('input',()=>{obj[key]=inp.value;if(o.on)o.on(inp);speichern()});
  let fuss=inp;
  if(o.secret){inp.type='password';
    fuss=h('div',{class:'secret'},inp,h('button',{type:'button',class:'btn klein',onclick:()=>{inp.type=inp.type==='password'?'text':'password'}},ikon('auge')))}
  if(o.scan){fuss=h('div',{class:'secret'},inp,h('button',{type:'button',class:'btn klein',onclick:()=>scanStarten(inp)},'Scan'))}
  if(o.jetzt){fuss=h('div',{class:'secret'},inp,h('button',{type:'button',class:'btn klein',onclick:()=>{inp.value=jetztZeit();inp.dispatchEvent(new Event('input'))}},'Jetzt'))}
  return h('div',{class:'field'},h('label',{for:id},label),fuss)}
function auswahl(label,obj,key,opts,on){const id='f'+(++zaehler);
  const s=h('select',{id},opts.map(o=>h('option',{value:o},o)));
  if(!opts.includes(obj[key])&&obj[key])s.append(h('option',{value:obj[key]},obj[key]));
  s.value=obj[key]||opts[0];obj[key]=s.value;
  s.addEventListener('change',()=>{obj[key]=s.value;if(on)on();speichern()});
  return h('div',{class:'field'},h('label',{for:id},label),s)}
function haken(label,obj,key,on){const i=h('input',{type:'checkbox'});i.checked=!!obj[key];
  i.addEventListener('change',()=>{obj[key]=i.checked;if(on)on();speichern()});
  return h('label',{class:'check'},i,label)}
const offenMerk={};
function bereich(titel,kinder,offen){const d=h('details',{},h('summary',{},titel),h('div',{class:'inhalt'},kinder));
  d.open=titel in offenMerk?offenMerk[titel]:!!offen;
  d.addEventListener('toggle',()=>{offenMerk[titel]=d.open});return d}
function listen(){const lst=(id,arr)=>h('datalist',{id},arr.map(o=>h('option',{value:o})));
  return h('div',{},lst('dl-fern',FERN),lst('dl-ktyp',KONTO_TYPEN),lst('dl-dt',ALT_DATENTRAEGER),lst('dl-lm',ALT_LOESCH),lst('dl-es',ALT_ENTSORGUNG),lst('dl-firmen',firmenListe().map(f=>f.name)))}

/* ---------- Ansicht: Liste ---------- */
async function zeigeListe(){
  cur=null;curT=null;ansicht='liste';
  const liste=(await alle().catch(()=>[]))||[];
  liste.sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')||b.geaendert-a.geaendert);
  const offen=liste.filter(e=>e.geaendert>(e.exportiert||0));
  const app=$('#app');app.replaceChildren(
    h('div',{class:'bar'},h('h1',{},logo(),h('span',{class:'t'},'DaTs Mobil')),
      h('button',{class:'icon',title:'Hell/Dunkel',onclick:themaWechseln},'◐')),
    h('div',{class:'wrap'},
      offen.length?h('div',{class:'banner'},h('b',{},offen.length+' Einrichtung(en) noch nicht exportiert. '),
        'Exportiere sie, bevor du sie im Büro einliest – so ist auch alles gesichert.'):null,
      liste.length?liste.map(e=>{const fertig=e.geraete.length&&e.geraete.every(g=>g.grundkonfig==='Abgeschlossen');
        const angefangen=e.geraete.some(g=>g.grundkonfig!=='Nicht begonnen');
        return h('button',{class:'karte-liste '+(fertig?'fertig':angefangen?'offen':''),onclick:()=>oeffne(e.uid)},
          h('b',{},e.firma||'(ohne Firma)'),
          h('span',{class:'hinweis'},[e.kunde,de(e.datum),e.geraete.length+' Gerät(e)'].filter(Boolean).join(' · ')),' ',
          e.geaendert>(e.exportiert||0)?h('span',{class:'badge warn'},'nicht exportiert'):h('span',{class:'badge ok'},'exportiert'))})
      :h('div',{class:'leer'},'Noch keine Einrichtungen.',h('br'),'Tippe unten auf „Neue Einrichtung“.'),
      h('div',{class:'row',style:'margin-top:8px'},
        h('label',{class:'btn klein',style:'cursor:pointer'},'Datei importieren',
          h('input',{type:'file',accept:'.json,application/json',multiple:true,style:'display:none',onchange:dateienEinlesen})),
        h('button',{class:'btn klein',onclick:vorlagenVerwalten},'Vorlagen'),
        h('button',{class:'btn klein',onclick:zeigeFirmen},'Firmen'),
        h('button',{class:'btn klein',onclick:()=>zeigeInventar(true)},'Inventar'))),
    h('div',{class:'fuss'},h('button',{class:'btn primary',onclick:neu},'＋ Neue Einrichtung')),listen())}

async function neu(firma){cur=neueEinrichtung(typeof firma==='string'?firma:'');curG=0;await sofortSpeichern();zeigeEdit(true)}
async function oeffne(uid){const l=await alle();cur=l.find(e=>e.uid===uid);if(!cur)return;curG=0;zeigeEdit(true)}
function zurueck(){sofortSpeichern().then(()=>{if(history.state&&history.state.v==='edit')history.back();else zeigeListe()})}
window.addEventListener('popstate',()=>{
  if(ansicht==='invedit'){invSofort().then(()=>zeigeInventar(false))}
  else if(ansicht==='inv'){zeigeListe()}
  else sofortSpeichern().then(zeigeListe)});

/* ---------- Gäste-WLAN: Felder erscheinen erst nach dem Haken ---------- */
function gastBlock(){
  const box=h('div',{});
  const zeichnen=()=>{
    if(!cur.gast_wlan&&(cur.gast_ssid||cur.gast_pw))cur.gast_wlan=true;  // vorhandene Daten bleiben sichtbar
    ersetze(box,
      haken('Gäste-WLAN eingerichtet',cur,'gast_wlan',()=>{

/* ---------- Fotos ---------- */
function bildLaden(datei){return new Promise((res,rej)=>{const u=URL.createObjectURL(datei);const i=new Image();
  i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Bild nicht lesbar'))};i.src=u})}
async function fotosHinzu(ev,g,neuZeichnen,max=1280,qual=0.8){
  const dateien=[...ev.target.files];ev.target.value='';
  for(const d of dateien){
    try{const img=await bildLaden(d);const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      g.fotos.push({id:neueId(),text:'',daten:c.toDataURL('image/jpeg',qual)})}
    catch(e){toast('Foto konnte nicht gelesen werden')}}
  speichern();neuZeichnen()}

/* ---------- Export und Import ---------- */
function exportObjekt(e){return {format:'dats-mobil',version:1,exportiert:new Date().toISOString(),
  einrichtung:{uid:e.uid,kunde:e.kunde,firma:e.firma,datum:e.datum,gast_wlan:!!e.gast_wlan,gast_ssid:e.gast_ssid||'',gast_pw:e.gast_pw||'',unterschrift:e.unterschrift||'',unterschrift_name:e.unterschrift_name||'',unterschrift_datum:e.unterschrift_datum||'',geraete:e.geraete.map(g=>{
    const o={uid:g.uid};for(const k of FELDER)o[k]=g[k]==null?'':g[k];
    const m=parseDauer(g.dauer);o.dauer=m!=null?String(m):'';
    for(const k of HAKEN)o[k]=!!g[k];o.checkliste=(g.checkliste||[]).filter(p=>(p.text||'').trim()).map(p=>({text:p.text,ok:!!p.ok}));
    o.software=g.software.filter(s=>(s.programm||'').trim());o.konten=g.konten;
    o.fotos=g.fotos.map(f=>({id:f.id,text:f.text||'',daten:f.daten}));return o})}}}
function dateiName(e){const s=t=>String(t||'').normalize('NFKD').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,40)||'x';
  return 'Einrichtung_'+s(e.firma)+'_'+(e.datum||heute())+'.json'}
async function exportieren(){
  if(!cur.firma.trim()||!cur.kunde.trim()){toast('Bitte Kunde und Firma eintragen');return}
  const name=dateiName(cur);
  const blob=new Blob([JSON.stringify(exportObjekt(cur))],{type:'application/json'});
  cur.exportiert=Date.now();cur.geaendert=Math.min(cur.geaendert,cur.exportiert);await sofortSpeichern();
  const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  toast('Exportiert: '+name)}
async function dateienEinlesen(ev){
  const dateien=[...ev.target.files];ev.target.value='';let n=0;
  for(const d of dateien){try{const o=JSON.parse(await d.text());
      if(o.format==='dats-firmen'&&Array.isArray(o.firmen)){firmenSpeichern(o.firmen);toast(o.firmen.length+' Firmenkarten geladen');continue}
      if(o.format!=='dats-mobil'||!o.einrichtung)throw new Error('falsches Format');
      const e=o.einrichtung;const vorh=((await alle())||[]).find(x=>x.uid===e.uid);
      if(vorh&&!confirm('„'+(e.firma||'ohne Firma')+'“ ist schon auf diesem Handy. Überschreiben?'))continue;
      await sichern({uid:e.uid,kunde:e.kunde||'',firma:e.firma||'',datum:e.datum||heute(),gast_wlan:!!e.gast_wlan,gast_ssid:e.gast_ssid||'',gast_pw:e.gast_pw||'',unterschrift:e.unterschrift||'',unterschrift_name:e.unterschrift_name||'',unterschrift_datum:e.unterschrift_datum||'',geaendert:Date.now(),exportiert:Date.now(),
        geraete:(e.geraete||[]).map(g=>Object.assign(neuesGeraet(e.datum||heute()),g,{
          software:g.software||[],konten:g.konten||[],fotos:g.fotos||[],checkliste:g.checkliste||[]}))});n++}
    catch(err){toast('„'+d.name+'“ nicht lesbar')}}
  if(n>0)toast(n+' Einrichtung(en) geladen');zeigeListe()}

/* ---------- Seriennummer per Kamera scannen ---------- */
async function scanStarten(inp){
  if(!('BarcodeDetector' in window)){toast('Scannen wird von diesem Browser nicht unterstützt – bitte abtippen');return}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){toast('Kamera nicht verfügbar');return}
  let strom;
  try{strom=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){toast('Kamera-Zugriff nicht erlaubt');return}
  let formate;try{formate=await BarcodeDetector.getSupportedFormats()}catch(e){formate=null}
  const wunsch=['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code','data_matrix','upc_a','upc_e'];
  const det=new BarcodeDetector(formate?{formats:wunsch.filter(f=>formate.includes(f))}:undefined);
  const video=h('video',{playsinline:true,muted:true,autoplay:true,style:'width:100%;max-height:70vh;background:#000;border-radius:12px'});
  video.srcObject=strom;
  let aktiv=true;
  const ende=()=>{aktiv=false;strom.getTracks().forEach(t=>t.stop());ueber.remove()};
  const ueber=h('div',{id:'scan',style:'position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px'},
    h('div',{style:'color:#fff;text-align:center;font-weight:600'},'Barcode oder QR-Code ins Bild halten'),video,
    h('button',{class:'btn',onclick:ende},'Abbrechen'));
  document.body.append(ueber);
  try{const pr=video.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
  const schleife=async()=>{
    if(!aktiv)return;
    try{const r=await det.detect(video);
      if(r.length&&r[0].rawValue){inp.value=r[0].rawValue;inp.dispatchEvent(new Event('input'));
        if(navigator.vibrate)navigator.vibrate(60);ende();toast('Gelesen: '+r[0].rawValue);return}}catch(e){}
    setTimeout(schleife,250)};
  schleife()}

/* ---------- Unterschrift des Kunden ---------- */
function unterschriftBlock(){
  const box=h('div',{});
  const zeichnen=()=>{
    if(cur.unterschrift){
      ersetze(box,
        h('div',{class:'hinweis'},'Unterschrieben von '+(cur.unterschrift_name||'–')+(cur.unterschrift_datum?' am '+de(cur.unterschrift_datum):'')),
        h('img',{src:cur.unterschrift,alt:'Unterschrift',style:'max-width:100%;background:#fff;border:1px solid var(--rand);border-radius:10px;margin:8px 0'}),
        h('button',{class:'btn klein danger',onclick:()=>{if(confirm('Unterschrift löschen?')){cur.unterschrift='';cur.unterschrift_name='';cur.unterschrift_datum='';speichern();zeichnen()}}},'Unterschrift löschen'));
      return}
    const c=h('canvas',{width:700,height:260,id:'sigcanvas',style:'width:100%;height:auto;aspect-ratio:700/260;background:#fff;border:1px solid var(--feldrand);border-radius:10px;touch-action:none;display:block'});
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    x.strokeStyle='#111';x.lineWidth=3.5;x.lineCap='round';x.lineJoin='round';
    let malt=false,gemalt=false,l=null;
    const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.addEventListener('pointerdown',e=>{malt=true;l=pos(e);try{c.setPointerCapture(e.pointerId)}catch(_){ }
      x.beginPath();x.arc(l[0],l[1],1.7,0,7);x.fillStyle='#111';x.fill();gemalt=true;e.preventDefault()});
    c.addEventListener('pointermove',e=>{if(!malt)return;const p=pos(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();l=p;e.preventDefault()});
    const aus=()=>{malt=false};c.addEventListener('pointerup',aus);c.addEventListener('pointercancel',aus);
    const name={n:cur.unterschrift_name||''};
    ersetze(box,
      h('div',{class:'hinweis',style:'margin-bottom:6px'},'Mit dem Finger unterschreiben:'),c,
      h('div',{style:'margin-top:10px'},feld('Name in Druckbuchstaben (leer = Kundenname)',name,'n')),
      h('div',{class:'row'},
        h('button',{class:'btn klein',onclick:()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);gemalt=false}},'Löschen'),
        h('button',{class:'btn klein primary',onclick:()=>{if(!gemalt){toast('Bitte erst unterschreiben');return}
          cur.unterschrift=c.toDataURL('image/jpeg',0.85);cur.unterschrift_name=(name.n||'').trim()||(cur.kunde||'').trim();cur.unterschrift_datum=heute();
          speichern();zeichnen();toast('Unterschrift gespeichert')}},'Unterschrift übernehmen')))};
  zeichnen();return box}

/* ---------- Firmenkarten (vom PC) ---------- */
function firmenListe(){const f=ls('firmen');return Array.isArray(f)?f:[]}
function firmenSpeichern(f){ls('firmen',f.filter(x=>x&&typeof x==='object'&&String(x.name||'').trim()).map(x=>({
  name:String(x.name||''),ansprechpartner:String(x.ansprechpartner||''),telefon:String(x.telefon||''),fern_ids:String(x.fern_ids||''),notizen:String(x.notizen||'')})))}
function mitTelLinks(text){
  return String(text||'').split('\n').map(z=>{if(!z.trim())return null;const teile=[];let ende=0,m;const re=/\+?\(?\d[\d ()\/\-]{4,}\d/g;
    while((m=re.exec(z))){teile.push(z.slice(ende,m.index));
      const ziffern=m[0].replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
      teile.push(h('a',{href:'tel:'+ziffern,style:'color:var(--text);font-weight:700'},m[0]));ende=m.index+m[0].length}
    teile.push(z.slice(ende));return h('div',{},teile)})}
function zeigeFirmen(){
  cur=null;
  try{history.pushState({v:'firmen'},'','#firmen')}catch(e){}
  const liste=document.createElement('div');
  const suche=h('input',{type:'search',placeholder:'Firma, Person oder Nummer suchen …',autocomplete:'off',id:'firmensuche'});
  const zeichnen=()=>{const q=suche.value.trim().toLowerCase();const alle=firmenListe();
    const treffer=alle.filter(f=>!q||[f.name,f.ansprechpartner,f.telefon,f.fern_ids,f.notizen].join('\n').toLowerCase().replace(/[\s\-()\/]/g,'').includes(q.replace(/[\s\-()\/]/g,'')));
    ersetze(liste,
      !alle.length?h('div',{class:'leer'},'Noch keine Firmenkarten.',h('br'),'Im Büro-Programm unter „Firmen“ → „Firmenkarten ans Handy“ speichern und hier importieren.'):null,
      alle.length&&!treffer.length?h('div',{class:'leer'},'Nichts gefunden.'):null,
      treffer.map(f=>{const d=h('details',{},h('summary',{},f.name),h('div',{class:'inhalt'},
        f.ansprechpartner?[h('div',{class:'hinweis'},'Ansprechpartner'),mitTelLinks(f.ansprechpartner)]:null,
        f.telefon?[h('div',{class:'hinweis',style:'margin-top:8px'},'Telefon'),mitTelLinks(f.telefon)]:null,
        f.fern_ids?[h('div',{class:'hinweis',style:'margin-top:8px'},'Fernwartungs-IDs'),h('div',{style:'white-space:pre-wrap'},f.fern_ids)]:null,
        f.notizen?[h('div',{class:'hinweis',style:'margin-top:8px'},'Notizen'),h('div',{style:'white-space:pre-wrap'},f.notizen)]:null,
        h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn klein primary',onclick:()=>neu(f.name)},'Neue Einrichtung hier'))));
        d.open=treffer.length===1;return d}))};
  suche.addEventListener('input',zeichnen);
  $('#app').replaceChildren(
    h('div',{class:'bar'},h('button',{class:'icon',onclick:()=>history.back(),title:'Zurück'},'←'),h('h1',{},logo(),h('span',{class:'t'},'Firmen'))),
    h('div',{class:'wrap'},h('div',{class:'field'},suche),liste,
      h('div',{class:'row',style:'margin-top:8px'},
        h('label',{class:'btn klein',style:'cursor:pointer'},'Firmenkarten importieren',
          h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:async ev=>{await dateienEinlesenFirmen(ev);zeichnen()}})))),
    listen());
  zeichnen()}
async function dateienEinlesenFirmen(ev){
  const d=ev.target.files[0];ev.target.value='';if(!d)return;
  try{const o=JSON.parse(await d.text());if(o.format!=='dats-firmen'||!Array.isArray(o.firmen))throw new Error('Format');
    firmenSpeichern(o.firmen);toast(o.firmen.length+' Firmenkarten geladen')}catch(e){toast('„'+d.name+'“ ist keine Firmenkarten-Datei')}}

/* ---------- Vorlagen und Design ---------- */
function vorlagenVerwalten(){
  const v=vorlagen(),namen=Object.keys(v);
  const a=prompt('Vorlagen:\n\n'+(namen.map(n=>'• '+n+' ('+v[n].length+' Programme)').join('\n')||'(keine)')+'\n\nName einer Vorlage eingeben, um sie zu löschen (leer = abbrechen):');
  if(a&&v[a]&&confirm('Vorlage „'+a+'“ löschen?')){delete v[a];ls('vorlagen',v);toast('Vorlage gelöscht')}}
/* ---------- Inventar (ausgebaute Teile, z. B. Netzteile) ---------- */
const INV_ARTEN=['Netzteil','Mainboard','Arbeitsspeicher (RAM)','Festplatte (HDD)','SSD','Grafikkarte','Prozessor','Lüfter / Kühler','Netzwerkkarte','Laufwerk','Kabel / Zubehör','Gehäuse','Sonstiges'];
const INV_VERW=['Offen','Behalten','Verkaufen','Entsorgen'];
const INV_STATUS=['Ungetestet','Funktioniert','Defekt'];
const INV_FELDER=['art','hersteller','modell','eigenschaften','seriennr','herkunft','verwendung','status','notiz'];
function neuesTeil(){const l=ls('inv_letzte')||{};
  return {uid:neueId(),art:l.art||'',hersteller:'',modell:'',eigenschaften:'',seriennr:'',herkunft:l.herkunft||'',
    verwendung:INV_VERW[0],status:INV_STATUS[0],notiz:'',datum:heute(),fotos:[],geaendert:Date.now(),exportiert:0}}
let invTimer=null;
function invSpeichernSpaeter(){if(!curT)return;curT.geaendert=Date.now();clearTimeout(invTimer);
  ls('inv_letzte',{art:curT.art,herkunft:curT.herkunft});
  invTimer=setTimeout(()=>invSichern(curT).catch(()=>toast('Speichern nicht möglich')),300)}
function invSofort(){if(!curT)return Promise.resolve();clearTimeout(invTimer);return invSichern(curT)}
const teilTitel=t=>[t.art,[t.hersteller,t.modell].filter(Boolean).join(' ')].filter(Boolean).join(' – ')||'Neues Teil';
let invFilter='';
async function zeigeInventar(neuAnzeigen){
  curT=null;ansicht='inv';
  if(neuAnzeigen){try{history.pushState({v:'inv'},'','#inv')}catch(e){}}
  const liste=((await invAlle().catch(()=>[]))||[]).sort((a,b)=>b.geaendert-a.geaendert);
  const offen=liste.filter(t=>t.geaendert>(t.exportiert||0));
  const q=invFilter.trim().toLowerCase();
  const sicht=q?liste.filter(t=>[t.art,t.hersteller,t.modell,t.eigenschaften,t.seriennr,t.herkunft,t.status,t.verwendung,t.notiz].join(' ').toLowerCase().includes(q)):liste;
  const such=h('input',{type:'search',placeholder:'Suchen …',value:invFilter,style:'margin-bottom:10px'});
  such.addEventListener('input',()=>{invFilter=such.value;clearTimeout(zeigeInventar.t);zeigeInventar.t=setTimeout(()=>zeigeInventar(false),250)});
  $('#app').replaceChildren(
    h('div',{class:'bar'},h('button',{class:'icon',onclick:invZurueck,title:'Zurück'},'←'),
      h('h1',{},logo(),h('span',{class:'t'},'Inventar'))),
    h('div',{class:'wrap'},
      offen.length?h('div',{class:'banner'},h('b',{},offen.length+' Teil(e) noch nicht exportiert. '),'Exportiere sie, bevor du sie im Büro einliest – so ist auch alles gesichert.'):null,
      liste.length?such:null,
      sicht.length?sicht.map(t=>{const klasse=t.status==='Funktioniert'?'fertig':t.status==='Defekt'?'defekt':'';
        return h('button',{class:'karte-liste '+klasse,onclick:()=>oeffneTeil(t.uid)},
          h('div',{class:'row',style:'flex-wrap:nowrap'},
            t.fotos&&t.fotos[0]?h('img',{src:t.fotos[0].daten,alt:'',style:'width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none'}):null,
            h('div',{style:'min-width:0'},h('b',{},teilTitel(t)),
              h('span',{class:'hinweis'},[t.eigenschaften,t.herkunft,(t.fotos||[]).length+' Foto(s)'].filter(Boolean).join(' · ')),' ',
              h('span',{class:'badge'+(t.status==='Funktioniert'?' ok':t.status==='Defekt'?' warn':'')},t.status),' ',
              t.verwendung&&t.verwendung!=='Offen'?h('span',{class:'badge'},t.verwendung):null,' ',
              t.geaendert>(t.exportiert||0)?h('span',{class:'badge warn'},'nicht exportiert'):null)))})
      :h('div',{class:'leer'},liste.length?'Nichts gefunden.':'Noch keine Teile.',h('br'),liste.length?'':'Tippe unten auf „Neues Teil“.'),
      liste.length?h('div',{class:'row',style:'margin-top:8px'},
        h('button',{class:'btn klein',onclick:()=>invExport(false)},'Neue/geänderte exportieren'),
        h('button',{class:'btn klein',onclick:()=>invExport(true)},'Alle exportieren')):null),
    h('div',{class:'fuss'},h('button',{class:'btn primary',onclick:neuesTeilAnlegen},'＋ Neues Teil')),listen());
  if(q)such.focus()}
function invZurueck(){if(history.state&&history.state.v==='inv')history.back();else zeigeListe()}
async function neuesTeilAnlegen(){curT=neuesTeil();await invSichern(curT);zeigeTeil(true)}
async function oeffneTeil(uid){curT=((await invAlle())||[]).find(t=>t.uid===uid);if(!curT)return;zeigeTeil(true)}
const teilLeer=t=>!(t.fotos&&t.fotos.length)&&!t.hersteller&&!t.modell&&!t.eigenschaften&&!t.seriennr&&!t.notiz;
async function leeresTeilWeg(){if(curT&&teilLeer(curT)){clearTimeout(invTimer);const u=curT.uid;curT=null;await invLoeschen(u);return true}return false}
function teilZurueck(){leeresTeilWeg().then(w=>w?null:invSofort()).then(()=>{if(history.state&&history.state.v==='invedit')history.back();else zeigeInventar(false)})}
async function teilLoeschen(){if(!curT||!confirm('Dieses Teil mit allen Fotos löschen?'))return;
  clearTimeout(invTimer);const u=curT.uid;curT=null;await invLoeschen(u);
  if(history.state&&history.state.v==='invedit')history.back();else zeigeInventar(false)}
function zeigeTeil(neuAnzeigen){
  ansicht='invedit';
  if(neuAnzeigen){try{history.pushState({v:'invedit'},'','#invedit')}catch(e){}}
  const t=curT;
  const fotos=h('div',{id:'fotos'});
  const fotosZeichnen=()=>{ersetze(fotos,
    t.fotos.map((f,i)=>h('div',{class:'foto'},h('img',{src:f.daten,alt:''}),
      h('div',{class:'grow',style:'flex:1'},feld('Beschriftung (z. B. Typenschild)',f,'text'),
        h('button',{class:'btn klein danger',onclick:()=>{if(confirm('Foto entfernen?')){t.fotos.splice(i,1);speichern();fotosZeichnen()}}},'Entfernen')))),
    h('div',{class:'row'},
      h('label',{class:'btn klein',style:'cursor:pointer'},'Foto aufnehmen',
        h('input',{type:'file',accept:'image/*',capture:'environment',style:'display:none',onchange:e=>fotosHinzu(e,t,fotosZeichnen,1800,0.85)})),
      h('label',{class:'btn klein',style:'cursor:pointer'},'Aus Galerie',
        h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:e=>fotosHinzu(e,t,fotosZeichnen,1800,0.85)}))),
    h('div',{class:'hinweis',style:'margin-top:6px'},'Tipp: das Typenschild/den Aufkleber scharf und aus der Nähe fotografieren, dazu ein Foto vom ganzen Teil.'))};
  $('#app').replaceChildren(
    h('div',{class:'bar'},h('button',{class:'icon',onclick:teilZurueck,title:'Zurück'},'←'),
      h('h1',{},logo(),h('span',{class:'t',id:'titel'},teilTitel(t))),
      h('button',{class:'icon',title:'Löschen',onclick:teilLoeschen,'aria-label':'Teil löschen'},ikon('papierkorb'))),
    h('div',{class:'wrap'},
      h('div',{class:'card'},fotos),
      h('div',{class:'card'},
        feld('Um was handelt es sich?',t,'art',{list:'dl-invart',on:()=>{$('#titel').textContent=teilTitel(t)}}),
        feld('Hersteller',t,'hersteller',{on:()=>{$('#titel').textContent=teilTitel(t)}}),
        feld('Modell',t,'modell',{on:()=>{$('#titel').textContent=teilTitel(t)}}),
        feld('Eigenschaften (z. B. 450 W, 24-polig)',t,'eigenschaften',{area:true,rows:2}),
        feld('Seriennummer',t,'seriennr',{scan:true}),
        feld('Herkunft (Rechner / Kunde)',t,'herkunft'),
        h('div',{class:'grid2'},auswahl('Verwendung',t,'verwendung',INV_VERW),auswahl('Status',t,'status',INV_STATUS)),
        feld('Notiz',t,'notiz',{area:true,rows:2}))),
    h('div',{class:'fuss'},h('button',{class:'btn',onclick:teilZurueck},'Fertig'),
      h('button',{class:'btn primary',onclick:async()=>{if(teilLeer(curT)){toast('Erst Foto oder Angaben eintragen');return}await invSofort();const alt=curT;curT=neuesTeil();curT.herkunft=alt.herkunft;curT.art=alt.art;await invSichern(curT);zeigeTeil(false);toast('Nächstes Teil')}},'＋ Nächstes Teil')),
    h('div',{},h('datalist',{id:'dl-invart'},INV_ARTEN.map(o=>h('option',{value:o})))));
  fotosZeichnen()}
const INV_GRENZE=14*1024*1024;
async function invExport(alleTeile){
  const liste=((await invAlle())||[]).sort((a,b)=>a.datum.localeCompare(b.datum)||a.geaendert-b.geaendert);
  const wahl=alleTeile?liste:liste.filter(t=>t.geaendert>(t.exportiert||0));
  if(!wahl.length){toast('Nichts zu exportieren');return}
  const pakete=[];let akt=[],groesse=0;
  for(const t of wahl){const gr=JSON.stringify(t).length;
    if(akt.length&&groesse+gr>INV_GRENZE){pakete.push(akt);akt=[];groesse=0}
    akt.push(t);groesse+=gr}
  if(akt.length)pakete.push(akt);
  const d=new Date(),stempel=heute()+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  for(let i=0;i<pakete.length;i++){
    const name='Inventar_'+stempel+(pakete.length>1?'_Teil'+(i+1):'')+'.json';
    const o={format:'dats-inventar',version:1,exportiert:d.toISOString(),teile:pakete[i].map(t=>({uid:t.uid,datum:t.datum,geaendert:t.geaendert,
      art:t.art,hersteller:t.hersteller,modell:t.modell,eigenschaften:t.eigenschaften,seriennr:t.seriennr,herkunft:t.herkunft,
      verwendung:t.verwendung,status:t.status,notiz:t.notiz,fotos:(t.fotos||[]).map(f=>({id:f.id,text:f.text||'',daten:f.daten}))}))};
    const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'})),download:name});
    document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    await new Promise(r=>setTimeout(r,900))}
  const jetzt=Date.now();
  for(const t of wahl){t.exportiert=jetzt;t.geaendert=Math.min(t.geaendert,jetzt);await invSichern(t)}
  toast(wahl.length+' Teil(e) exportiert'+(pakete.length>1?' ('+pakete.length+' Dateien)':''));zeigeInventar(false)}

function themaSetzen(t){document.documentElement.setAttribute('data-theme',t)}
function themaWechseln(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'hell':'dark';themaSetzen(t);ls('thema',t)}
themaSetzen(ls('thema')||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'hell'));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
zeigeListe();
</script>
