  --akzent:#2c2927; --akzent-text:#ffffff; --marke:#e61923; --feld:#ffffff; --feldrand:#aea89e;
  --neutral:#dcd8d0; --gefahr:#c62828; --ok:#2e7d4f; --warn:#b26a00;
}
html[data-theme="dark"]{
  --bg:#121012; --card:#1c191c; --text:#f1eff1; --leicht:#a29ea6; --rand:#2f2b30;
  --akzent:#f1eff1; --akzent-text:#171317; --marke:#ff4651; --feld:#141214; --feldrand:#5d5962;
  --neutral:#2b282c; --gefahr:#ff7b72; --ok:#5ec48a; --warn:#e0a040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--rand)}
.bar h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punkt{width:14px;height:14px;border-radius:50%;background:var(--marke);flex:none}
.logo{width:32px;height:32px;border-radius:8px;flex:none;display:block;box-shadow:0 0 0 1px var(--rand)}
.row>.btn{display:inline-flex;align-items:center;justify-content:center}
.wrap{padding:14px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--rand);border-radius:14px;padding:14px;margin:0 0 12px}
.btn{border:1px solid var(--rand);background:var(--card);border-radius:12px;padding:12px 16px;min-height:46px;
  font-weight:600;cursor:pointer}
.btn.primary{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.btn.danger{color:var(--gefahr)}
.btn.klein{min-height:38px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:disabled{opacity:.5}
.icon{border:0;background:none;font-size:22px;min-width:44px;min-height:44px;cursor:pointer;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.field>label{font-size:13px;color:var(--leicht);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--feld);border:1px solid var(--feldrand);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical}
.field input[aria-invalid=true]{border-color:var(--marke);border-width:2px}
.field .fehltext{font-size:13px;color:var(--marke);font-weight:600}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marke);outline-offset:1px}
.secret{display:flex;gap:6px}.secret input{flex:1}
.check{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;font-weight:500}
.check input{width:24px;height:24px;accent-color:var(--akzent);flex:none}
details{background:var(--card);border:1px solid var(--rand);border-radius:14px;margin:0 0 12px;overflow:hidden}
summary{padding:14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--leicht);
  cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";font-size:16px}
details[open]>summary::after{content:"▴"}
details>.inhalt{padding:0 14px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--rand);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.aktiv{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.vchip{border:1px solid var(--rand);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--text);font-size:inherit}
.vchip.aktiv{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.hinweis{font-size:13px;color:var(--leicht)}
.gruppe{font-weight:700;font-size:13px;margin:14px 2px 6px;color:var(--leicht)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--neutral)}
.badge.warn{background:var(--marke);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.karte-liste{display:block;width:100%;text-align:left;border:1px solid var(--rand);border-left:6px solid var(--feldrand);
  background:var(--card);border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer}
.karte-liste.defekt{border-left-color:var(--marke)} .karte-liste.fertig{border-left-color:var(--ok)} .karte-liste.offen{border-left-color:var(--warn)}
.karte-liste b{display:block;font-size:17px}
.w11{border:1px solid var(--rand);border-left:6px solid var(--feldrand);border-radius:10px;padding:10px 12px;margin:4px 0 12px;background:var(--card)}
.w11 b{display:block;font-size:16px}
.w11.ja,.w11.cpu{border-left-color:var(--ok)} .w11.nein{border-left-color:var(--marke)} .w11.bedingt,.w11.q{border-left-color:var(--warn)}
.banner{background:var(--card);border:1px solid var(--marke);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.leer{text-align:center;color:var(--leicht);padding:40px 10px}
.fuss{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--rand);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.fuss .btn{flex:1}
.foto{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.foto img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--rand)}
.eintrag{border:1px solid var(--rand);border-radius:12px;padding:10px;margin:0 0 10px;background:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:20;
  background:var(--akzent);color:var(--akzent-text);padding:10px 16px;border-radius:12px;display:none;max-width:90vw}
dialog{border:1px solid var(--rand);border-radius:14px;background:var(--card);color:var(--text);max-width:92vw;width:420px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ---------- Windows-11-Prüfung (Stand: offizielle Microsoft-Listen, Windows 11 25H2) ---------- */
const W11_STAND='Stand: Microsoft-Liste 25H2';
function w11Norm(s){return ' '+String(s||'').toLowerCase().replace(/\(r\)|\(tm\)|\(c\)|®|™/g,' ')
  .replace(/@?\s*[\d.,]+\s*ghz/g,' ').replace(/[,;:_/]+/g,' ').replace(/\s+/g,' ')+' '}
function w11Cpu(roh){
  const x=w11Norm(roh);let m;
  const R=(s,t)=>({s,t});
  if(x.trim().length<2)return null;
  /* ----- AMD ----- */
  if(/threadripper/.test(x)){m=x.match(/threadripper\s*(?:pro\s*)?(\d{4})/);
    if(m)return m[1][0]==='1'?R('nein','Threadripper 1000 (1. Generation) wird nicht unterstützt'):R('ja','Threadripper '+m[1]+' ist gelistet');
    return R('?','Threadripper-Modell nicht erkannt')}
  if(/epyc/.test(x)){m=x.match(/epyc\s*(\d{4})/);
    if(m){const z=m[1],l=z[3];
      if(z[0]==='7')return l==='1'?R('nein','EPYC 7001 (1. Generation) wird nicht unterstützt'):R('ja','EPYC '+z+' ist gelistet');
      if('489'.includes(z[0]))return R('ja','EPYC '+z+' ist gelistet');
      return R('?','EPYC '+z+': nur teilweise gelistet')}
    return R('?','EPYC-Modell nicht erkannt')}
  if(/ryzen\s*embedded|\b[vr]1\d{3}[a-z]?\b/.test(x))return R('?','Ryzen Embedded ist nur teilweise gelistet');
  if(/ryzen\s*ai|ryzen\s*z\d/.test(x))return R('ja','Ryzen AI / Z-Serie ist gelistet');
  if(/ryzen|\br[3579]\s*(?:pro\s*)?\d{4}/.test(x)){
    const y=x.replace(/\bpro\b|\bmobile\b|with radeon graphics|\bamd\b|ryzen/g,' ');
    m=y.match(/\b(\d{4})\s*([a-z]{0,3}\d?[a-z]{0,2})\b/);
    if(!m)return R('?','Ryzen-Modell nicht erkannt (z. B. Ryzen 5 3600)');
    const z=m[1],s=m[2],d=z[0];
    if(/^(1200|1600)\s*af$/.test(z+' '+s)||/^(1200|1600)af$/.test(z+s))return R('?','Ryzen '+z+' AF (12 nm) – nicht eindeutig gelistet, bitte prüfen');
    if(d==='1')return R('nein','Ryzen 1000 (1. Generation, Zen) wird nicht unterstützt');
    if(d==='2'){if(/^(g|ge)$/.test(s)||/[uh]/.test(s))return R('nein','Ryzen 2000 Mobil/APU (Zen) wird nicht unterstützt');
      return R('ja','Ryzen 2000 (Zen+) Desktop ist gelistet')}
    return R('ja','Ryzen '+z+' ist gelistet')}
  if(/athlon/.test(x)){
    if(/athlon\s*(ii|x[234]|64|xp|mp|neo|\d\s*x2|x2)/.test(x))return R('nein','Alter Athlon wird nicht unterstützt');
    m=x.match(/athlon\s*(?:gold|silver|pro)?\s*(\d{3,4})/);
    if(m)return m[1][0]==='3'?R('ja','Athlon '+m[1]+' ist gelistet'):R('nein','Athlon '+m[1]+' (Zen/Raven Ridge oder älter) wird nicht unterstützt');
    return R('?','Athlon-Modell nicht erkannt')}
  if(/phenom|sempron|opteron|\bfx[-\s]?\d{4}|\ba(?:4|6|8|10|12)[-\s]\d{4}|\be[12][-\s]\d{4}|turion|geode|\bak?[-\s]?\d{4}\b/.test(x)&&!/intel/.test(x))
    return R('nein','Ältere AMD-Serie wird nicht unterstützt');
  /* ----- Qualcomm ----- */
  if(/snapdragon|qualcomm/.test(x)){
    if(/835/.test(x))return R('nein','Snapdragon 835 steht nicht auf der Liste');
    if(/7c|8c|8cx|x\s*elite|x\s*plus|\bx1[a-z]?|850/.test(x))return R('ja','Dieser Snapdragon ist gelistet');
    return R('?','Snapdragon nicht eindeutig – bitte prüfen')}
  /* ----- Intel ----- */
  if(/core\s*ultra/.test(x))return R('ja','Core Ultra ist gelistet');
  if(!/\bi[3579]\b|\bi[3579][\s-]/.test(x)){m=x.match(/\bcore\s*([357])\s*(\d{3})\s*[a-z]{0,3}\b/);
    if(m)return R('ja','Intel Core Serie 1/2 ist gelistet')}
  if(/pentium/.test(x)){
    if(/pentium\s*(4|d|iii|ii|pro|mmx|m|dual)\b|pentium\s*dual/.test(x))return R('nein','Alter Pentium wird nicht unterstützt');
    m=x.match(/\b([gunjtepb]?)(\d{3,4})([a-z]{0,2})\b/);
    if(m){const L=m[1],N=m[2],S=m[3];
      if('tepb'.includes(L)&&L)return R('nein','Alter Pentium wird nicht unterstützt');
      if(L==='j'||L==='n'){
        if(N[0]==='3'||N[0]==='4')return R('nein','Pentium '+L.toUpperCase()+N+' (Apollo Lake/Braswell) wird nicht unterstützt');
        if(N[0]==='5'||(N[0]==='6'&&L==='n'))return R('ja','Pentium Silver '+L.toUpperCase()+N+' ist gelistet');
        return R('?','Pentium-Modell nicht eindeutig gelistet')}
      if(N.length===3)return R('nein','Alter Pentium wird nicht unterstützt');
      if(L==='g'){
        if('5678'.includes(N[0]))return R('ja','Pentium Gold G'+N+' ist gelistet');
        return R('nein','Pentium G'+N+' (6./7. Generation oder älter) wird nicht unterstützt')}
      if('4567'.includes(N[0])){
        if(N[0]==='4'&&!/gold/.test(x)&&!/^[uy]/.test(S))return R('nein','Pentium '+N+' wird nicht unterstützt');
        return R('ja','Pentium Gold '+N+S.toUpperCase()+' ist gelistet')}
      if(N[0]==='8'||N[0]==='6')return R('ja','Pentium '+N+' ist gelistet')}
    return R('?','Pentium-Modell nicht eindeutig – bitte prüfen')}
  if(/celeron/.test(x)){
    m=x.match(/\b([gjnb]?)(\d{3,4})([a-z]{0,2})\b/);
    if(!m||/celeron\s*(d|m)\b/.test(x))return /celeron\s*(d|m)\b/.test(x)?R('nein','Alter Celeron wird nicht unterstützt'):R('?','Celeron-Modell nicht erkannt');
    const L=m[1],N=m[2],S=m[3];
    if(L==='b'||N.length===3)return R('nein','Alter Celeron wird nicht unterstützt');
    if(L==='g'){return '456'.includes(N[0])?R('ja','Celeron G'+N+' ist gelistet'):R('nein','Celeron G'+N+' (6./7. Generation oder älter) wird nicht unterstützt')}
    if(L==='j'){if(N[0]==='4')return R('ja','Celeron J'+N+' ist gelistet');
      return N[0]==='6'?R('?','Celeron J'+N+' nicht eindeutig gelistet'):R('nein','Celeron J'+N+' wird nicht unterstützt')}
    if(L==='n'){if(N[0]==='4'&&/^[01]/.test(N.slice(1,2))&&!/^45/.test(N))return R('ja','Celeron N'+N+' ist gelistet');
      if(N[0]==='5')return R('ja','Celeron N'+N+' ist gelistet');
      return /^[46]/.test(N[0])?R('?','Celeron N'+N+' nicht eindeutig gelistet'):R('nein','Celeron N'+N+' wird nicht unterstützt')}
    if(N[0]==='1'||N[0]==='2')return R('nein','Celeron '+N+S.toUpperCase()+' wird nicht unterstützt');
    if(N[0]==='3'){if(['3867','3965'].includes(N))return R('ja','Celeron '+N+S.toUpperCase()+' ist gelistet');
      if(['3205','3215','3755','3765'].includes(N))return R('nein','Celeron '+N+S.toUpperCase()+' (Broadwell) wird nicht unterstützt');
      return R('?','Celeron '+N+S.toUpperCase()+' nicht eindeutig gelistet – bitte prüfen')}
    if('4567'.includes(N[0]))return R('ja','Celeron '+N+S.toUpperCase()+' ist gelistet');
    return R('?','Celeron-Modell nicht eindeutig')}
  if(/\batom\b|\bx[567]-?[ze]?\d{4}/.test(x)&&!/xeon/.test(x)){
    if(/\bx7\d{3}/.test(x))return R('ja','Atom x7000 ist gelistet');
    if(/\bx6\d{3}/.test(x))return R('?','Atom x6000 nicht eindeutig gelistet');
    return R('nein','Atom wird nicht unterstützt (nur Atom x7000)')}
  if(/core\s*2|core2|core\s*duo|core\s*solo|\bduo\b|\bquad\b/.test(x)&&!/\bi[3579]/.test(x))return R('nein','Core 2 / Core Duo wird nicht unterstützt');
  m=x.match(/\bi([3579])[\s-]*(?:m\s*)?(n)?(\d{3,5})([a-z]{0,3}\d{0,2})\b/);
  if(m){const kl=m[1],nn=m[2],dg=m[3],suf=m[4];
    if(nn)return R('ja','Core i'+kl+'-N'+dg+' ist gelistet');
    let gen=dg.length===3?1:dg.length===4?(dg[0]==='1'?+dg.slice(0,2):+dg[0]):+dg.slice(0,2);
    if((kl==='7'||kl==='9')&&/^xe?$/.test(suf)&&dg.length>=4&&(gen===7||gen===9||gen===10))
      return R('nein','Core X (X-Serie) steht nicht auf der Microsoft-Liste');
    if(kl==='7'&&dg==='7820'&&/^hq/.test(suf))return R('?','i7-7820HQ nur im Surface Studio 2 unterstützt');
    if(gen>=8&&gen<=14)return R('ja','Core i'+kl+', '+gen+'. Generation ist gelistet');
    if(gen>14)return R('?','Generation '+gen+' nicht erkannt');
    return R('nein','Core i'+kl+', '+gen+'. Generation – erst ab der 8. Generation unterstützt')}
  m=x.match(/\bm([357])[\s-]*(\d)(\d{3}|y\d{2})([a-z]?)/);
  if(m&&/core/.test(x))return +m[2]>=8?R('ja','Core m, 8. Generation ist gelistet'):R('nein','Core m, '+m[2]+'. Generation wird nicht unterstützt');
  if(/\bn(?:90|95|97|100|150|200|250|300|305|355)\b|\bu300\b|processor\s*300\b|intel\s*300\b/.test(x))return R('ja','Intel N-/U300-Serie ist gelistet');
  /* ----- Xeon ----- */
  const xeon=/xeon/.test(x);
  m=x.match(/\be[357][\s-]*\d{4}/);if(m)return R('nein','Xeon E3/E5/E7 wird nicht unterstützt');
  m=x.match(/\b[xewl][35]\d{3}\b/);if(m&&(xeon||/\b[xewl][35]\d{3}[a-z]?\b/.test(x)))return R('nein','Xeon dieser Generation wird nicht unterstützt');
  m=x.match(/\be[\s-]*(2[1-4]\d{2})/);
  if(m&&(xeon||/\be-2[1-4]\d{2}/.test(x)))return R('ja','Xeon E-'+m[1]+' ist gelistet');
  m=x.match(/\bw[\s-]*(\d{4,5})(m?)/);
  if(m&&(xeon||/\bw-\d{4}/.test(x))){const z=m[1],a2=z.slice(0,2);
    if(z.length===5)return R('ja','Xeon W-'+z+'M ist gelistet');
    if(['12','13','24','25','33','34','35'].includes(a2))return R('ja','Xeon W-'+z+' ist gelistet');
    if(['21','22','31','32'].includes(a2))return R('?','Xeon W-'+z+' steht nicht (mehr) auf der aktuellen Liste');
    return R('?','Xeon W nicht eindeutig')}
  m=x.match(/\bd[\s-]*(\d{4})/);
  if(m&&(xeon||/\bd-\d{4}/.test(x))){const a2=m[1].slice(0,2);
    if(['17','18','27','28'].includes(a2))return R('ja','Xeon D-'+m[1]+' ist gelistet');
    if(['15','16'].includes(a2))return R('nein','Xeon D-'+m[1]+' wird nicht unterstützt');
    return R('?','Xeon D nicht eindeutig')}
  if(xeon){
    if(/phi/.test(x))return R('nein','Xeon Phi wird nicht unterstützt');
    if(/(platinum|gold|silver|bronze)\s*\d{4}|scalable|xeon\s*(6|max)\b/.test(x))return R('ja','Xeon Scalable ist gelistet');
    return R('?','Xeon-Modell nicht eindeutig – bitte prüfen')}
  return R('?','Modell nicht erkannt – bitte genau eintragen, z. B. „i5-7500“ oder „Ryzen 5 3600“')}

/* Mainboard-Hinweis über Sockel und Chipsatz */
function w11Board(roh){
  const x=w11Norm(roh);if(x.trim().length<2)return null;const R=(s,t)=>({s,t});let m;
  m=x.match(/\blga\s*-?\s*(775|1156|1155|1150|1366|2011|2066)\b|\bam[23]\+?\b|\bfm[12]\+?\b|\bsocket\s*(478|754|939|940|am2|am3)\b|\bpga\s*988\b|\bs?478\b/);
  if(m)return R('nein','Sockel '+m[0].toUpperCase().trim()+' ist zu alt für Windows 11');
  if(/\blga\s*-?\s*(1200|1700|1851)\b/.test(x)||/\bam5\b/.test(x))return R('ja','Sockel ist aktuell genug – der Prozessor entscheidet');
  if(/\blga\s*-?\s*1151\b/.test(x))return R('?','LGA1151: 6./7. Generation nein, 8./9. Generation ja – Chipsatz/Prozessor prüfen');
  if(/\bam4\b/.test(x))return R('?','AM4: Ryzen 1000 nein, ab Ryzen 2000 ja – Prozessor prüfen');
  m=x.match(/\b(h81|b85|h87|z87|h97|z97|q87|q85|b75|h77|z77|z68|p67|h67|h61|q67|q77|b65|h55|p55|h57|q57|p45|g41|g31|g33|g43|x58|x79|x99|x299|h110|b150|h170|z170|q150|q170|b250|h270|z270|q250|q270|a320|b350|x370|a300|b300|x300|760g|880g|990fx|785g|790x)[a-z]{0,2}\b/);
  if(m){const c=m[1];
    if(/^(a320|b350|x370|a300|b300|x300)$/.test(c))return R('?','Chipsatz '+c.toUpperCase()+': kann Ryzen 1000 (nein) oder 2000+ (ja) – Prozessor prüfen');
    return R('nein','Chipsatz '+c.toUpperCase()+' gehört zu einer Generation, die Windows 11 nicht unterstützt')}
  m=x.match(/\b(h310|b360|h370|z370|q370|b365|z390|c246|h410|b460|h470|z490|q470|w480|h510|b560|h570|z590|w580|h610|b660|h670|z690|q670|w680|b760|h770|z790|b860|z890|h810|b450|x470|a520|b550|x570|a620|b650|x670|b840|b850|x870)[a-z]{0,2}\b/);
  if(m)return R('ja','Chipsatz '+m[1].toUpperCase()+' passt zu Windows-11-fähigen Prozessoren');
  return null}

function w11Gesamt(t){
  if(t.w11===false||t.w11===0)return null;   /* Prüfung für dieses Teil nicht eingeschaltet */
  const art=String(t.art||'').toLowerCase();
  const istCpu=/prozessor|\bcpu\b/.test(art),istBoard=/mainboard|motherboard|mutterplatine/.test(art);
  if(!istCpu&&!istBoard)return null;
  const basis=istCpu?w11Cpu([t.hersteller,t.modell].filter(Boolean).join(' ')):w11Board([t.hersteller,t.modell,t.eigenschaften].filter(Boolean).join(' '));
  if(!basis)return null;

/* ---------- Zeit und Dauer (wie im Büro-Programm) ---------- */
function parseDauer(t){t=String(t||'').trim().toLowerCase().replace(',','.');if(!t)return null;let m;
  if(m=t.match(/^(\d+):(\d{1,2})$/))return +m[1]*60+ +m[2];
  if(m=t.match(/^(\d+(?:\.\d+)?)\s*(?:min\w*)?$/))return Math.round(+m[1]);
  if(m=t.match(/^(\d+(?:\.\d+)?)\s*(?:h|std\w*|stunden?)$/))return Math.round(+m[1]*60);
  if(m=t.match(/^(\d+)\s*(?:h|std\w*|stunden?)\s*(\d+)\s*(?:m|min\w*)?$/))return +m[1]*60+ +m[2];
  return null}
function vonBis(v,b){const p=s=>{const m=/^(\d\d):(\d\d)$/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
  const a=p(v),c=p(b);return a==null||c==null||c<a?null:c-a}
function gDauer(g){const m=parseDauer(g.dauer);return m!=null?m:vonBis(g.von,g.bis)}
function dauerText(m){if(m==null)return '';if(m<60)return m+' Min';return Math.floor(m/60)+' Std '+(m%60)+' Min'}

function geraetNeu(){
  const g=neuesGeraet(cur.datum||heute());
  if(cur.geraete.length&&confirm('Einstellungen vom ersten Gerät übernehmen?\n\nÜbernommen werden Typ, Art, „Bearbeitet von“, Konfiguration, Programme, Fernwartungs-Tool und WLAN. Nicht: Namen, Passwörter, Zeiten, Seriennummer, Artikelnummer.')){
    const q=cur.geraete[0];for(const k of UEBERNEHMEN)g[k]=JSON.parse(JSON.stringify(q[k]==null?'':q[k]))}
  cur.geraete.push(g);curG=cur.geraete.length-1;speichern();chipsZeichnen();geraetZeichnen()}

function geraetEntfernen(){
  if(cur.geraete.length<=1){toast('Mindestens ein Gerät muss bleiben');return}
  if(!confirm('Dieses Gerät wirklich entfernen?'))return;
  cur.geraete.splice(curG,1);curG=Math.max(0,curG-1);speichern();chipsZeichnen();geraetZeichnen()}

/* ---------- Ansicht: Gerät ---------- */
function geraetZeichnen(){
  const g=cur.geraete[curG];if(!g)return;

        h('button',{class:'btn klein danger',onclick:()=>{g.software.splice(i,1);speichern();softwareZeichnen()}},'Entfernen')))),
    h('div',{class:'row'},
      h('button',{class:'btn klein',onclick:()=>{g.software.push({programm:'',konto:'Nein',bemerkung:''});speichern();softwareZeichnen()}},'＋ Programm'),

/* ---------- Seriennummer per Kamera scannen ---------- */
async function scanStarten(inp){
  if(!('BarcodeDetector' in window)){toast('Scannen wird von diesem Browser nicht unterstützt – bitte abtippen');return}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){toast('Kamera nicht verfügbar');return}
  let strom;
  try{strom=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){toast('Kamera-Zugriff nicht erlaubt');return}
  let formate;try{formate=await BarcodeDetector.getSupportedFormats()}catch(e){formate=null}
  const wunsch=['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code','data_matrix','upc_a','upc_e'];
  const det=new BarcodeDetector(formate?{formats:wunsch.filter(f=>formate.includes(f))}:undefined);
  const video=h('video',{playsinline:true,muted:true,autoplay:true,style:'width:100%;max-height:70vh;background:#000;border-radius:12px'});
  video.srcObject=strom;
  let aktiv=true;
  const ende=()=>{aktiv=false;strom.getTracks().forEach(t=>t.stop());ueber.remove()};
  const ueber=h('div',{id:'scan',style:'position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px'},
    h('div',{style:'color:#fff;text-align:center;font-weight:600'},'Barcode oder QR-Code ins Bild halten'),video,
    h('button',{class:'btn',onclick:ende},'Abbrechen'));
  document.body.append(ueber);
  try{const pr=video.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
  const schleife=async()=>{
    if(!aktiv)return;
    try{const r=await det.detect(video);
      if(r.length&&r[0].rawValue){inp.value=r[0].rawValue;inp.dispatchEvent(new Event('input'));
        if(navigator.vibrate)navigator.vibrate(60);ende();toast('Gelesen: '+r[0].rawValue);return}}catch(e){}
    setTimeout(schleife,250)};
  schleife()}

const INV_GRENZE=14*1024*1024;
async function invExport(alleTeile){
  const liste=((await invAlle())||[]).sort((a,b)=>a.datum.localeCompare(b.datum)||a.geaendert-b.geaendert);
  const wahl=alleTeile?liste:liste.filter(t=>t.geaendert>(t.exportiert||0));
  if(!wahl.length){toast('Nichts zu exportieren');return}
  const pakete=[];let akt=[],groesse=0;
  for(const t of wahl){const gr=JSON.stringify(t).length;
    if(akt.length&&groesse+gr>INV_GRENZE){pakete.push(akt);akt=[];groesse=0}
    akt.push(t);groesse+=gr}
  if(akt.length)pakete.push(akt);
  const d=new Date(),stempel=heute()+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  for(let i=0;i<pakete.length;i++){
    const name='Inventar_'+stempel+(pakete.length>1?'_Teil'+(i+1):'')+'.json';
    const o={format:'dats-inventar',version:1,exportiert:d.toISOString(),listen:invListen(liste).map(x=>({name:x.name,herkunft:x.herkunft})),teile:pakete[i].map(t=>({uid:t.uid,liste:teilListe(t),datum:t.datum,geaendert:t.geaendert,

      verwendung:t.verwendung,status:t.status,notiz:t.notiz,tpm:t.tpm||'',secureboot:t.secureboot||'',w11:!!t.w11,fotos:(t.fotos||[]).map(f=>({id:f.id,text:f.text||'',daten:f.daten}))}))};
    const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'})),download:name});
    document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    await new Promise(r=>setTimeout(r,900))}
  const jetzt=Date.now();
  for(const t of wahl){t.exportiert=jetzt;t.geaendert=Math.min(t.geaendert,jetzt);await invSichern(t)}
  toast(wahl.length+' Teil(e) exportiert'+(pakete.length>1?' ('+pakete.length+' Dateien)':''));zeigeInventar(false)}
